<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bleu:#1a56a0;--bleu-clair:#e8f0fb;--vert:#16a34a;--vert-pale:#dcfce7;
  --rouge:#dc2626;--rouge-pale:#fee2e2;--orange:#d97706;--orange-pale:#fef3c7;
  --gris:#f4f6f9;--gris-bord:#dde3ed;--texte:#1a1f2e;--texte-doux:#5a6478;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gris);color:var(--texte);min-height:100vh;padding-bottom:80px;}
#app{max-width:480px;margin:0 auto;padding:16px;}

/* LOGIN */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-logo{width:72px;height:72px;background:var(--bleu);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:16px;}
.login-title{font-size:22px;font-weight:800;color:var(--bleu);margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--texte-doux);margin-bottom:24px;}
.login-card{background:white;border-radius:16px;padding:24px;width:100%;max-width:340px;box-shadow:0 4px 20px rgba(0,0,0,0.1);}
.login-error{display:none;color:var(--rouge);font-size:13px;margin-top:8px;text-align:center;}

/* CARDS */
.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.07);}
.card-title{font-size:12px;font-weight:700;color:var(--texte-doux);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px;}

/* FORMS */
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--texte-doux);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em;}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--gris-bord);border-radius:10px;font-size:14px;font-family:inherit;background:white;color:var(--texte);outline:none;transition:border-color 0.2s;}
.form-input:focus{border-color:var(--bleu);}
select.form-input{cursor:pointer;}

/* BUTTONS */
.btn-primary{width:100%;padding:13px;background:var(--bleu);color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:opacity 0.2s;}
.btn-primary:active{opacity:0.85;}
.btn-secondary{width:100%;padding:11px;background:var(--gris);color:var(--texte);border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;}
.btn-ok{padding:8px 16px;background:var(--vert-pale);color:var(--vert);border:2px solid var(--vert);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-nok{padding:8px 16px;background:var(--rouge-pale);color:var(--rouge);border:2px solid var(--rouge);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-add{padding:8px 14px;background:var(--bleu-clair);color:var(--bleu);border:1.5px solid var(--bleu);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;}

/* NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--gris-bord);display:flex;z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 12px;cursor:pointer;font-size:10px;font-weight:600;color:var(--texte-doux);border:none;background:none;}
.nav-item.active{color:var(--bleu);}
.nav-item span{font-size:22px;margin-bottom:2px;}

/* BADGES */
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;}
.badge-ok{background:var(--vert-pale);color:var(--vert);}
.badge-nok{background:var(--rouge-pale);color:var(--rouge);}
.badge-matin{background:#e0f2fe;color:#0369a1;}
.badge-soiree{background:#ede9fe;color:#7c3aed;}

/* STATS */
.stat-box{padding:12px;border-radius:10px;text-align:center;flex:1;}
.stat-box.ok{background:var(--vert-pale);border:1.5px solid var(--vert);}
.stat-box.nok{background:var(--rouge-pale);border:1.5px solid var(--rouge);}
.stat-box.info{background:var(--bleu-clair);border:1.5px solid var(--bleu);}
.stat-val{font-size:22px;font-weight:800;}
.stat-label{font-size:11px;font-weight:600;margin-top:2px;}

/* TABLE */
.table-suivi{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
.table-suivi th{background:var(--bleu);color:white;padding:7px 6px;text-align:center;}
.table-suivi th:first-child{text-align:left;}
.table-suivi td{padding:7px 6px;border-bottom:1px solid var(--gris);text-align:center;}
.table-suivi td:first-child{text-align:left;}
.table-suivi tr:nth-child(even){background:#f8fafc;}
.table-suivi .total-row{background:var(--bleu);color:white;font-weight:700;}

.info-banner{background:var(--bleu-clair);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--bleu);margin-bottom:12px;}
.empty-state{text-align:center;padding:30px 20px;color:var(--texte-doux);}
.empty-icon{font-size:36px;margin-bottom:8px;}

/* SECTION HEADER */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-title{font-size:16px;font-weight:700;}

/* CONTROLE */
.controle-block{background:var(--gris);border-radius:10px;padding:12px;margin-bottom:10px;}
.controle-num{font-size:12px;font-weight:700;color:var(--bleu);margin-bottom:8px;text-transform:uppercase;}
.tournee-row{display:grid;grid-template-columns:24px 1fr 60px;gap:6px;align-items:center;margin-bottom:6px;}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:999;animation:fadeInOut 3s ease forwards;}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}85%{opacity:1}100%{opacity:0}}
.toast.ok{background:#16a34a;color:white;}
.toast.err{background:#dc2626;color:white;}
</style>

// ── DB ──────────────────────────────────────────────────────────
async function sbFetch(method, path, body){
  const opts = {method, headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json','Prefer':'return=representation'}};
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, opts);
  const t = await res.text();
  if(!res.ok) throw new Error(t);
  return t ? JSON.parse(t) : [];
}
const db = {
  get: (t,q='') => sbFetch('GET', `${t}?${q}`),
  post: (t,b) => sbFetch('POST', t, b),

};

function fmtDate(d){ return new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}); }
function fmtHeure(iso){ if(!iso) return '—'; const d=new Date(iso.endsWith('Z')?iso:iso+'Z'); return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function getToday(){ return new Date().toISOString().split('T')[0]; }

function calcMoyenneColis(session){
  // Moyenne globale (première → dernière saisie) pour une session
  const sess = session || S.sessionColis || 1;
  const data = S.colisData.filter(c=>c.quantite_colis&&c.heure_controle&&(c.session_numero||1)===sess);
  if(data.length < 2) return null;
  const sorted = [...data].sort((a,b)=>a.heure_controle.localeCompare(b.heure_controle));
  const first = sorted[0], last = sorted[sorted.length-1];
  const [fh,fm] = first.heure_controle.split(':').map(Number);
  const [lh,lm] = last.heure_controle.split(':').map(Number);
  let dureeMin = (lh*60+lm)-(fh*60+fm);
  if(dureeMin<=0) dureeMin+=24*60;
  // Déduire les arrêts machine cumulés totaux
  const totalArret = last.arret_machine_cumul||0;
  const dureeEffective = Math.max(1, dureeMin - totalArret);
  const totalColis = last.quantite_colis - first.quantite_colis;
  if(totalColis<=0) return Math.round((last.quantite_colis/dureeEffective)*60);
  return Math.round((totalColis/dureeEffective)*60);
}

function calcMoyenneTraanche(sorted, index){
  // Moyenne entre avant-dernière et dernière saisie
  if(index < 1) return null;
  const prev = sorted[index-1];
  const curr = sorted[index];
  if(!prev.quantite_colis || !curr.quantite_colis) return null;
  const [ph,pm] = prev.heure_controle.split(':').map(Number);
  const [ch,cm] = curr.heure_controle.split(':').map(Number);
  let dureeMin = (ch*60+cm)-(ph*60+pm);
  if(dureeMin<=0) dureeMin+=24*60;
  if(dureeMin===0) return null;
  // Déduire uniquement les nouveaux arrêts de cette tranche
  const arretPrev = prev.arret_machine_cumul||0;
  const arretCurr = curr.arret_machine_cumul||0;
  const arretTranche = Math.max(0, arretCurr - arretPrev);
  const dureeEffective = Math.max(1, dureeMin - arretTranche);
  const diffColis = curr.quantite_colis - prev.quantite_colis;
  if(diffColis<=0) return null;
  return Math.round((diffColis/dureeEffective)*60);
}

// ── CHANTIERS ──────────────────────────────────────────────────
function renderSelectionAgentsChantier(n, c){
  // Agents de l'équipe en cours (pour Aprem/Soirée : fusionner)
  const equipe = S.agent.equipe || S.epiEquipeSelectionnee || '';
  let agents = [];
  if(equipe === 'Soirée' || equipe === 'Aprem'){
    agents = [...(PERSONNEL_DB['Aprem']||[]), ...(PERSONNEL_DB['Soirée']||[])];
  } else if(equipe === 'Matin'){
    agents = PERSONNEL_DB['Matin']||[];
  } else {
    // Admin sans équipe : tous les agents
    agents = Object.values(PERSONNEL_DB).flat();
  }

  // Noms déjà sélectionnés (stockés comme texte séparé par virgules)
  const dejaSelectionnes = (c.noms_chantier||'').split(',').map(s=>s.trim()).filter(Boolean);

  if(!agents.length) return `<input class="form-input" type="text" placeholder="Noms des agents" value="${c.noms_chantier||''}" onchange="sauvegarderControle(${n},'noms_chantier',this.value)" />`;

  return `<div style="background:var(--gris);border-radius:10px;padding:10px;max-height:200px;overflow-y:auto">
    ${agents.map(a=>{
      const nomComplet = `${a.nom} ${a.prenom}`;
      const key = `ch-${n}-${a.id}`;
      const checked = dejaSelectionnes.includes(nomComplet);
      return `<label style="display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;border-bottom:1px solid var(--gris-bord)">
        <input type="checkbox" id="${key}" ${checked?'checked':''} onchange="toggleAgentChantier(${n},this)" style="width:18px;height:18px;accent-color:var(--bleu);cursor:pointer" data-nom="${nomComplet}" />
        <span style="font-size:13px;font-weight:600">${a.nom} ${a.prenom}</span>
      </label>`;
    }).join('')}
  </div>`;
}

async function toggleAgentChantier(numControle, checkbox){
  const nom = checkbox.dataset.nom;
  const c = S.controles.find(x=>x.numero===numControle)||{};
  const dejaSelectionnes = (c.noms_chantier||'').split(',').map(s=>s.trim()).filter(Boolean);
  let nouveaux;
  if(checkbox.checked){
    nouveaux = [...dejaSelectionnes.filter(n=>n!==nom), nom];
  } else {
    nouveaux = dejaSelectionnes.filter(n=>n!==nom);
  }
  const valeur = nouveaux.join(', ');
  await sauvegarderControle(numControle, 'noms_chantier', valeur);
}

// ── COLIS/H ────────────────────────────────────────────────────

  const equipe = S.agent.equipe || 'Soirée';
  const tranches = equipe==='Matin' ? TRANCHES_MATIN : TRANCHES_SOIREE;
  const moy = calcMoyenneColis();
  const moyColor = moy ? (moy>=OBJECTIF_COLIS?'var(--vert)':'var(--rouge)') : 'var(--texte-doux)';
  
  const sessionActuelle = S.sessionColis||1;
  return `<div class="card">
    <div class="card-title">📦 Contrôle Colis/H — Objectif ${OBJECTIF_COLIS} colis/h</div>
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <div class="stat-box info" style="background:${moy&&moy>=OBJECTIF_COLIS?'var(--vert-pale)':moy?'var(--rouge-pale)':'var(--bleu-clair)'};border-color:${moyColor}">
        <div class="stat-val" style="color:${moyColor}">${moy||'—'}</div>
        <div class="stat-label" style="color:${moyColor}">Moyenne colis/h</div>
      </div>
      <div class="stat-box ok">
        <div class="stat-val" style="color:var(--vert)">${OBJECTIF_COLIS}</div>
        <div class="stat-label" style="color:var(--vert)">Objectif</div>
      </div>
    </div>
    <table class="table-suivi">
      <thead><tr>
        <th>Tranche</th><th>Camion + H</th><th>H relevé</th><th style="min-width:90px">Qté colis</th><th>Moy/h</th><th>Arrêt (min cumul)</th><th>Cadence</th>
      </tr></thead>
      <tbody>
        ${(()=>{
          const sorted = [...S.colisData].filter(c=>c.quantite_colis&&c.heure_controle&&(c.session_numero||1)===sessionActuelle).sort((a,b)=>a.heure_controle.localeCompare(b.heure_controle));
          return tranches.map(tranche=>{
            const c = S.colisData.find(x=>x.tranche===tranche&&(x.session_numero||1)===sessionActuelle)||{};
            const idx = sorted.findIndex(x=>x.tranche===tranche);
            const moyTranche = idx>0 ? calcMoyenneTraanche(sorted,idx) : null;
            const moyColor = moyTranche ? (moyTranche>=OBJECTIF_COLIS?'var(--vert)':'var(--rouge)') : 'var(--texte-doux)';
            return `<tr>
              <td style="font-weight:600;font-size:11px">${tranche}</td>
              <td><input style="width:100%;border:none;background:transparent;font-size:11px;text-align:center" type="text" placeholder="—" value="${c.camion_h_debut||''}" onblur="sauvegarderColis('${tranche}','camion_h_debut',this.value)" /></td>
              <td style="text-align:center"><input style="width:75px;border:1.5px solid var(--gris-bord);border-radius:6px;font-size:11px;text-align:center;padding:4px" type="time" value="${c.heure_controle||''}" onchange="sauvegarderColis('${tranche}','heure_controle',this.value)" /></td>
              <td><input style="width:90px;border:1.5px solid var(--gris-bord);border-radius:8px;background:white;font-size:15px;font-weight:700;text-align:center;padding:6px 4px" type="number" placeholder="—" value="${c.quantite_colis||''}" onblur="sauvegarderColis('${tranche}','quantite_colis',parseInt(this.value)||null)" /></td>
              <td style="font-weight:700;color:${moyColor};font-size:13px;text-align:center">${moyTranche||'—'}</td>
              <td><input style="width:70px;border:1.5px solid var(--gris-bord);border-radius:8px;background:white;font-size:13px;text-align:center;padding:5px 4px" type="number" placeholder="0" value="${c.arret_machine_cumul||''}" onblur="sauvegarderColis('${tranche}','arret_machine_cumul',parseInt(this.value)||0)" /></td>
              <td data-tranche="${tranche}" style="font-weight:700;color:${c.quantite_colis?(c.quantite_colis>=OBJECTIF_COLIS?'var(--vert)':'var(--rouge)'):'var(--texte-doux)'}">
                <span class="cadence-icone">${c.quantite_colis?(c.quantite_colis>=OBJECTIF_COLIS?'✅':'❌'):'—'}</span>
              </td>
            </tr>
            ${(c.quantite_colis&&c.quantite_colis<OBJECTIF_COLIS)?`<tr style="background:var(--orange-pale)"><td colspan="7"><input style="width:100%;border:none;background:transparent;font-size:11px;padding:4px" type="text" placeholder="Raison..." value="${c.raison_non_atteinte||''}" onblur="sauvegarderColis('${tranche}','raison_non_atteinte',this.value)" /></td></tr>`:''}`;
          }).join('');
        })()}
      </tbody>
    </table>
  </div>`;
}

// ── EPI ────────────────────────────────────────────────────────
function renderEPI(){
  const equipe = S.agent.equipe || S.epiEquipeSelectionnee || '';
  // Pour Guillaume (admin sans équipe), Aprem = Aprem ; pour Soirée, fusionner Aprem+Soirée
  let personnel = [];
  if(equipe === 'Soirée' || equipe === 'Aprem'){
    personnel = [...(PERSONNEL_DB['Aprem']||[]), ...(PERSONNEL_DB['Soirée']||[])];
  } else if(equipe){
    personnel = PERSONNEL_DB[equipe]||[];
  }
  const epis = S.epiData||[];
  const manquements = epis.filter(e=>e.nom_prenom!=='RAS');
  const EPI_TYPES = ['Gants','Gilet haute visibilité','Chaussures de sécurité','Gants + Gilet','Gants + Chaussures','Gilet + Chaussures','Tout manquant'];

  if(S.epiValide && !S.agent.est_responsable){
    return `<div class="card">
      <div class="card-title">🦺 Contrôle EPI — ${fmtDate(S.date)}</div>
      <div style="background:var(--vert-pale);border-radius:10px;padding:12px;text-align:center;color:var(--vert);font-weight:700;margin-bottom:12px">✅ EPI validés — Saisie verrouillée 🔒</div>

        <div style="font-weight:700">${e.nom_prenom}</div>

        <div style="color:var(--texte-doux);font-size:12px">${e.solution||'—'}</div>
      </div>`).join('')}
    </div>`;
  }

  return `<div class="card">
    <div class="card-title">🦺 Contrôle EPI — ${fmtDate(S.date)}</div>
    ${S.epiValide?`<div style="background:var(--orange-pale);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--orange);margin-bottom:12px;font-weight:600">⚠️ EPI déjà validés par le chef d'équipe — Modification admin</div>`:`<div class="info-banner">Coche les agents avec EPI manquant. Laisse tout décoché si tout le monde est conforme (RAS).</div>`}
    ${S.agent.est_responsable && !S.agent.equipe?`
    <div class="form-group">
      <label class="form-label">Équipe à contrôler</label>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button onclick="S.epiEquipeSelectionnee='Matin';render()" style="flex:1;padding:12px;border-radius:10px;border:2px solid ${equipe==='Matin'?'var(--bleu)':'var(--gris-bord)'};background:${equipe==='Matin'?'var(--bleu-clair)':'white'};color:${equipe==='Matin'?'var(--bleu)':'var(--texte)'};font-weight:700;cursor:pointer">☀️ Matin</button>
        <button onclick="S.epiEquipeSelectionnee='Aprem';render()" style="flex:1;padding:12px;border-radius:10px;border:2px solid ${equipe==='Aprem'?'var(--bleu)':'var(--gris-bord)'};background:${equipe==='Aprem'?'var(--bleu-clair)':'white'};color:${equipe==='Aprem'?'var(--bleu)':'var(--texte)'};font-weight:700;cursor:pointer">🌆 Aprem</button>
      </div>
    </div>`:''}
    ${!equipe?`<div class="empty-state"><div class="empty-icon">👆</div><div>Sélectionne une équipe ci-dessus</div></div>`:''}
    ${personnel.map(agent=>{
      const nomComplet = `${agent.nom} ${agent.prenom}`;
      const epi = manquements.find(e=>e.nom_prenom===nomComplet);
      const key = nomComplet.replace(/[\s']/g,'_');
      return `<div style="padding:10px 0;border-bottom:1px solid var(--gris)">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:${epi?'8px':'0'}">
          <input type="checkbox" id="epi-${key}" ${epi?'checked':''}
            onchange="toggleEPI('${nomComplet}',this.checked)"
            style="width:20px;height:20px;cursor:pointer;accent-color:var(--rouge)" />
          <label for="epi-${key}" style="font-size:14px;font-weight:600;cursor:pointer;flex:1">${agent.nom} ${agent.prenom}</label>
          ${epi?'<span style="color:var(--rouge);font-size:18px">⚠️</span>':'<span style="color:var(--vert);font-size:18px">✅</span>'}

            <option value="">-- EPI manquant --</option>

          </select>
          <input class="form-input" style="flex:1;min-width:160px" type="text" placeholder="Solution apportée..." value="${epi.solution||''}" onchange="modifierEPI('${epi.id}','solution',this.value)" />
        </div>`:''}
      </div>`;
    }).join('')}
    <button class="btn-primary" onclick="validerEPI()" style="background:var(--vert);margin-top:14px">✅ Valider les EPI et continuer</button>
  </div>`;
}

async function toggleEPI(nom, checked){
  const manquements = (S.epiData||[]).filter(e=>e.nom_prenom!=='RAS');
  const epi = manquements.find(e=>e.nom_prenom===nom);
  if(checked && !epi){
    const created = await db.post('epi',{vacation_id:S.vacationId, nom_prenom:nom, epi_manquant:'', solution:''});
    S.epiData.push(created[0]);
  } else if(!checked && epi){
    await db.del('epi',`id=eq.${epi.id}`);
    S.epiData = S.epiData.filter(e=>e.id!==epi.id);
  }
  render();
}

// ── ACTIONS ────────────────────────────────────────────────────
async function connexion(){
  const prenom = document.getElementById('login-prenom')?.value.trim();
  const mdp = document.getElementById('login-code')?.value.trim();
  if(!prenom||!mdp){ document.getElementById('login-error').style.display='block'; return; }
  try{
    // Trouver l'email correspondant au prénom dans la table agents
    const agentRes = await db.get('agents',`prenom=ilike.${encodeURIComponent(prenom)}&select=*`);
    if(!agentRes.length){ document.getElementById('login-error').style.display='block'; return; }
    const agentData = agentRes[0];
    if(!agentData.email){ document.getElementById('login-error').style.display='block'; return; }
    // Connexion via Supabase Auth
    const { data, error } = await supabaseAuth.auth.signInWithPassword({
      email: agentData.email,
      password: mdp
    });
    if(error){ document.getElementById('login-error').style.display='block'; return; }
    S.agent = agentData;
    S.authSession = data.session;
    S.loading = true; render();
    await chargerTout();
    S.loading = false; render();
    await demanderPermissionNotif();
    demarrerRappelColis();
  }catch(e){ toast('Erreur connexion','err'); console.error(e); }
}

function renderChangerCode(){
  return `<div class="card">
    <div class="card-title">🔑 Changer mon mot de passe</div>
    <div class="form-group"><label class="form-label">Nouveau mot de passe</label><input class="form-input" id="new-code" type="password" placeholder="Minimum 6 caractères" /></div>
    <div class="form-group"><label class="form-label">Confirmer le mot de passe</label><input class="form-input" id="confirm-code" type="password" placeholder="Confirmer" /></div>
    <button class="btn-primary" onclick="changerCode()">✅ Enregistrer</button>

}
async function changerCode(){
  const n = document.getElementById('new-code')?.value.trim();
  const c = document.getElementById('confirm-code')?.value.trim();
  if(!n||!c) return toast('Remplis les deux champs','err');
  if(n!==c) return toast('Les mots de passe ne correspondent pas','err');
  if(n.length<6) return toast('Mot de passe trop court (min 6 caractères)','err');
  try{
    const { error } = await supabaseAuth.auth.updateUser({ password: n });
    if(error) return toast('Erreur : '+error.message,'err');
    toast('✅ Mot de passe modifié !','ok');
    S.vue = 'epi'; render();

}

// ── CHARGEMENT ─────────────────────────────────────────────────
async function chargerTout(){
  await getOrCreateVacation();
  await Promise.all([chargerControles(), chargerColis(), chargerEPI(), chargerAgentsPersonnel()]);
  if(S.agent.est_responsable) S.tousAgents = await db.get('agents','select=id,prenom,nom,equipe,email,est_responsable&order=nom.asc');
}

async function chargerAgentsPersonnel(){
  try{
    const tous = await db.get('agents','select=id,prenom,nom,equipe&equipe=not.is.null&order=nom.asc');
    PERSONNEL_DB = {};
    tous.forEach(a=>{
      const eq = a.equipe;
      if(!PERSONNEL_DB[eq]) PERSONNEL_DB[eq] = [];
      PERSONNEL_DB[eq].push(a);
    });
  }catch(e){ console.error('Erreur chargement agents',e); }
}

async function getOrCreateVacation(){
  const equipe = S.agent.equipe || 'Toutes';
  let vacs = await db.get('vacations_suivi',`agent_id=eq.${S.agent.id}&date=eq.${S.date}&select=*`);
  if(!vacs.length){
    const created = await db.post('vacations_suivi',{agent_id:S.agent.id, equipe, date:S.date});
    S.vacationId = created[0].id;
  } else {
    S.vacationId = vacs[0].id;
  }
}

async function chargerControles(){
  S.controles = await db.get('controles_chantiers',`vacation_id=eq.${S.vacationId}&order=numero.asc`);
  const ids = S.controles.map(c=>c.id);
  if(ids.length){
    S.tournees = await db.get('tournees',`controle_id=in.(${ids.join(',')})&order=numero.asc`);
  } else { S.tournees = []; }
}

async function chargerColis(){
  S.colisData = await db.get('controles_colis',`vacation_id=eq.${S.vacationId}&order=created_at.asc`);
}

async function chargerEPI(){
  S.epiData = await db.get('epi',`vacation_id=eq.${S.vacationId}&order=created_at.asc`);
  const vac = await db.get('vacations_suivi',`id=eq.${S.vacationId}&select=epi_valide`);
  S.epiValide = vac[0]?.epi_valide || false;
}

// ── SAUVEGARDE CONTROLES ────────────────────────────────────────
async function sauvegarderControle(num, champ, valeur){
  try{
    let c = S.controles.find(x=>x.numero===num);
    if(!c){
      const created = await db.post('controles_chantiers',{vacation_id:S.vacationId, numero:num, [champ]:valeur});
      S.controles.push(created[0]);
    } else {
      await db.patch('controles_chantiers',`id=eq.${c.id}`,{[champ]:valeur});
      c[champ] = valeur;
    }
  }catch(e){ toast('Erreur sauvegarde','err'); }
}

async function sauvegarderTournee(numControle, numTournee, champ, valeur){
  try{
    let c = S.controles.find(x=>x.numero===numControle);
    if(!c){
      const created = await db.post('controles_chantiers',{vacation_id:S.vacationId, numero:numControle});
      c = created[0]; S.controles.push(c);
    }
    let t = S.tournees ? S.tournees.find(x=>x.controle_id===c.id&&x.numero===numTournee) : null;
    if(!t){
      const created = await db.post('tournees',{controle_id:c.id, numero:numTournee, [champ]:valeur});
      if(!S.tournees) S.tournees = [];
      S.tournees.push(created[0]);
    } else {
      await db.patch('tournees',`id=eq.${t.id}`,{[champ]:valeur});
      t[champ] = valeur;
    }
    if(champ==='resultat') render();
  }catch(e){ toast('Erreur sauvegarde','err'); }
}

// ── SAUVEGARDE COLIS ────────────────────────────────────────────
async function sauvegarderColis(tranche, champ, valeur){
  try{
    if(!S.vacationId){ toast('Session non initialisée','err'); return; }
    const sessionNum = S.sessionColis||1;
    let c = S.colisData.find(x=>x.tranche===tranche&&(x.session_numero||1)===sessionNum);
    const now = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    const autoHeure = (champ==='quantite_colis' && valeur && (!c||!c.heure_controle)) ? now : null;
    const autoCadence = (champ==='quantite_colis' && valeur!=null) ? (valeur>=OBJECTIF_COLIS) : null;

    if(!c){
      const body = {vacation_id:S.vacationId, tranche, session_numero:sessionNum, [champ]:valeur};
      if(autoHeure) body.heure_controle = autoHeure;
      if(autoCadence!==null) body.cadence_ok = autoCadence;
      const created = await db.post('controles_colis', body);
      if(created && created[0]) S.colisData.push(created[0]);
    } else {
      const body = {[champ]:valeur};
      if(autoHeure) body.heure_controle = autoHeure;
      if(autoCadence!==null) body.cadence_ok = autoCadence;
      await db.patch('controles_colis',`id=eq.${c.id}`, body);
      c[champ] = valeur;
      if(autoHeure) c.heure_controle = autoHeure;
      if(autoCadence!==null) c.cadence_ok = autoCadence;
    }
    // Re-render uniquement pour mettre à jour l'indicateur cadence (✅/❌), sans perturber le focus
    if(champ==='quantite_colis'){
      // Mise à jour visuelle légère sans re-render complet
      const row = document.querySelector(`[data-tranche="${tranche}"]`);
      if(row){
        const val = parseInt(valeur)||0;
        const icone = row.querySelector('.cadence-icone');
        if(icone) icone.textContent = val>=OBJECTIF_COLIS?'✅':'❌';
        const couleur = val>=OBJECTIF_COLIS?'var(--vert)':'var(--rouge)';
        if(icone) icone.style.color = couleur;
      }
    }
  }catch(e){ toast('Erreur sauvegarde','err'); }
}

// ── EPI ────────────────────────────────────────────────────────
async function validerEPI(){
  try{
    // Si aucun manquement, créer une entrée RAS
    if(!S.epiData.length){
      await db.post('epi',{vacation_id:S.vacationId, nom_prenom:'RAS', epi_manquant:'RAS', solution:'Tous les agents conformes'});
    }
    await db.patch('vacations_suivi',`id=eq.${S.vacationId}`,{epi_valide:true});
    S.epiValide = true;
    toast('✅ EPI validés !','ok');
    S.vue = 'chantiers';
    render();
  }catch(e){ toast('Erreur validation','err'); }
}

function nouvelleSession(){
  const sessions = [...new Set((S.colisData||[]).map(c=>c.session_numero||1))];
  const maxSession = Math.max(...sessions, 0);
  S.sessionColis = maxSession + 1;
  toast(`✅ Nouvelle session ${S.sessionColis} démarrée`,'ok');
  render();
}

async function ajouterEPI(){
  try{
    const created = await db.post('epi',{vacation_id:S.vacationId, nom_prenom:'', epi_manquant:''});
    S.epiData.push(created[0]);
    render();
  }catch(e){ toast('Erreur','err'); }
}

async function supprimerEPI(id){
  try{
    await db.del('epi',`id=eq.${id}`);
    S.epiData = S.epiData.filter(e=>e.id!==id);
    render();
  }catch(e){ toast('Erreur','err'); }
}

async function modifierEPI(id, champ, valeur){
  try{
    await db.patch('epi',`id=eq.${id}`,{[champ]:valeur});
    const e = S.epiData.find(x=>x.id===id);
    if(e) e[champ]=valeur;
  }catch(e){ toast('Erreur','err'); }
}

// ── SERVICE WORKER ────────────────────────────────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/cahier-app/sw.js').then(reg=>{
    console.log('SW registered');
    // Forcer la mise à jour immédiate du SW à chaque chargement
    reg.update();
    if(reg.waiting){ reg.waiting.postMessage({type:'SKIP_WAITING'}); }
    reg.addEventListener('updatefound', ()=>{
      const newSW = reg.installing;
      if(newSW){ newSW.addEventListener('statechange', ()=>{
        if(newSW.state==='installed' && navigator.serviceWorker.controller){
          newSW.postMessage({type:'SKIP_WAITING'});
        }
      }); }
    });
  }).catch(e=>console.warn('SW error', e));
  
  // Écouter les messages du SW pour reprogrammer
  navigator.serviceWorker.addEventListener('message', e=>{
    if(e.data && e.data.type==='RESCHEDULE'){
      programmmerProchainRappel();
    }
  });
}

// ── NOTIFICATIONS ─────────────────────────────────────────────
async function demanderPermissionNotif(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default'){
    await Notification.requestPermission();
  }
}

function envoyerNotif(titre, corps){
  if(Notification.permission !== 'granted') return;
  const notif = new Notification(titre, {
    body: corps,
    icon: 'https://guillaume-prod.github.io/cahier-app/favicon.png',
    badge: 'https://guillaume-prod.github.io/cahier-app/favicon.png',
    tag: 'rappel-colis',
    renotify: true,
  });
  notif.onclick = () => {
    window.focus();
    S.vue = 'colis';
    render();
    notif.close();
  };
}

let rappelColisInterval = null;

function programmmerProchainRappel(){
  if(Notification.permission !== 'granted') return;
  const now = new Date();
  const msJusquaProchainHeure = (60 - now.getMinutes()) * 60 * 1000 - now.getSeconds() * 1000;
  
  // Envoyer au Service Worker
  if(navigator.serviceWorker.controller){
    navigator.serviceWorker.controller.postMessage({
      type: 'SCHEDULE_NOTIF',
      delay: msJusquaProchainHeure
    });
  } else {
    // Fallback local si SW pas encore actif
    if(rappelColisInterval) clearInterval(rappelColisInterval);
    setTimeout(()=>{
      envoyerNotif('📦 Rappel relevé colis', 'Pense à saisir le relevé colis !');
      rappelColisInterval = setInterval(()=>{
        envoyerNotif('📦 Rappel relevé colis', 'Pense à saisir le relevé colis !');
      }, 60*60*1000);
    }, msJusquaProchainHeure);
  }
}

function demarrerRappelColis(){
  programmmerProchainRappel();
}

function arreterRappelColis(){
  if(rappelColisInterval){
    clearInterval(rappelColisInterval);
    rappelColisInterval = null;
  }
  // Signaler au SW d'arrêter
  if(navigator.serviceWorker.controller){
    navigator.serviceWorker.controller.postMessage({type: 'STOP_NOTIF'});
  }
}

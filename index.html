function renderKPI(){
  if(S.kpiLoading) return `<div class="card" style="text-align:center;color:var(--texte-doux)">⏳ Calcul des indicateurs…</div>`;
  const rows = S.kpiRows||[];
  const recalc = `<div class="card"><div class="card-title">🔄 Mise à jour de l'historique</div>
    <div class="info-banner">Les KPI se mettent à jour tout seuls pendant les vacations. Utilisez ce bouton pour recalculer les jours passés.</div>
    <div style="display:flex;gap:8px;align-items:end"><div style="flex:1"><label class="form-label">À partir du</label><input class="form-input" type="date" id="kpi-recalc-from" value="2026-10-01" /></div>
    <button class="btn-primary" id="kpi-recalc-btn" style="width:auto;padding:10px 14px" onclick="recalculerKPI()">Recalculer</button></div></div>`;
  if(S.kpiIndispo) return `<div class="card"><div class="info-banner" style="background:#fee2e2;color:#991b1b">⚠️ La table des KPI n'existe pas encore dans Supabase (étape SQL « 5_kpi_automatique.sql » à faire).</div></div>`;
  if(!rows.length) return recalc+`<div class="card"><div class="empty-state" style="padding:16px;color:var(--texte-doux)">Aucune donnée KPI pour l'instant. Cliquez sur « Recalculer ».</div></div>`;
  const H = agregHebdo(rows); const weeks = Object.keys(H).sort();
  const sel = (S.kpiSemaine && H[S.kpiSemaine]) ? S.kpiSemaine : weeks[weeks.length-1];
  const prec = addJours(sel,-7); const fmtW = w=>new Date(w+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
  const hist = [7,6,5,4,3,2,1,0].map(k=>addJours(sel,-7*k));
  let lastG = '';
  const lignes = INDIC.map(i=>{
    const cur = H[sel][i.id]; const pr = H[prec]?H[prec][i.id]:null;
    const quatre = [0,1,2,3].map(k=>H[addJours(sel,-7*k)]?H[addJours(sel,-7*k)][i.id]:null).filter(x=>x!=null);
    const moy4 = _avg(quatre);
    let evo = '—', col = '#6b7280', fl = '';
    if(cur!=null && pr!=null){
      const diff = cur-pr;
      if(i.u==='%'||i.u==='min') evo = (diff>0?'+':'')+(Math.round(diff*10)/10).toString().replace('.',',')+(i.u==='%'?' pt':' min');
      else evo = pr? ((diff>0?'+':'')+(Math.round(diff/pr*1000)/10).toString().replace('.',',')+' %') : (diff>0?'+':'')+fmtN(diff);
      fl = diff>0?'▲':(diff<0?'▼':'＝');
      col = i.pol===0||diff===0 ? '#6b7280' : (diff*i.pol>0?'#16a34a':'#dc2626');
    }
    const head = i.g!==lastG ? `<tr><td colspan="6" style="background:#eef2f9;font-weight:700;padding:6px 8px;font-size:12px;color:#1a56a0">${i.g}</td></tr>` : ''; lastG = i.g;
    return head+`<tr style="border-bottom:1px solid #eee"><td style="padding:6px 8px;font-size:12px">${i.l}</td>
      <td style="padding:6px 4px;text-align:right;font-weight:700;font-size:12px">${fmtKPI(cur,i.u)}</td>
      <td style="padding:6px 4px;text-align:right;font-size:11px;color:#6b7280">${fmtKPI(pr,i.u)}</td>
      <td style="padding:6px 4px;text-align:right;font-size:11px;font-weight:700;color:${col};white-space:nowrap">${fl} ${evo}</td>
      <td style="padding:6px 4px;text-align:right;font-size:11px;color:#6b7280">${fmtKPI(moy4,i.u)}</td>
      <td style="padding:6px 4px">${sparkline(hist.map(w=>H[w]?H[w][i.id]:null), col==='#6b7280'?'#1a56a0':col)}</td></tr>`;
  }).join('');
  return `<div class="card"><div class="card-title">📈 Suivi KPI</div>
    <label class="form-label">Semaine du (lundi)</label>
    <select class="form-input" onchange="choisirSemaineKPI(this.value)" style="margin-bottom:8px">${weeks.slice().reverse().map(w=>`<option value="${w}" ${w===sel?'selected':''}>${fmtW(w)} → ${fmtW(addJours(w,6))}</option>`).join('')}</select>
    <div style="font-size:11px;color:var(--texte-doux);margin-bottom:6px">Évolution = comparaison avec la semaine précédente (${fmtW(prec)}). Vert = mieux, rouge = moins bien. Courbe : 8 dernières semaines.</div>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:420px">
      <tr style="background:#1a56a0;color:white;font-size:11px"><th style="padding:6px 8px;text-align:left">Indicateur</th><th style="padding:6px 4px;text-align:right">Semaine</th><th style="padding:6px 4px;text-align:right">Préc.</th><th style="padding:6px 4px;text-align:right">Évolution</th><th style="padding:6px 4px;text-align:right">Moy. 4 sem.</th><th></th></tr>
      ${lignes}</table></div></div>${htmlAbsencesPersonnes()}${recalc}`;
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/cahier-app/sw.js').then(reg=>{
    console.log('SW registered');
    // Forcer la mise à jour immédiate du SW à chaque chargement
    reg.update();
    if(reg.waiting){ reg.waiting.postMessage({type:'SKIP_WAITING'}); }
    reg.addEventListener('updatefound', ()=>{
      const newSW = reg.installing;
      if(newSW){ newSW.addEventListener('statechange', ()=>{
        if(newSW.state==='installed' && navigator.serviceWorker.controller){
          newSW.postMessage({type:'SKIP_WAITING'});
        }
      }); }
    });
  }).catch(e=>console.warn('SW error', e));
  
  // Écouter les messages du SW pour reprogrammer
  navigator.serviceWorker.addEventListener('message', e=>{
    if(e.data && e.data.type==='RESCHEDULE'){
      programmmerProchainRappel();
    }
  });
}

function envoyerNotif(titre, corps){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = {
    body: corps,
    icon: 'https://guillaume-prod.github.io/cahier-app/favicon.png',
    badge: 'https://guillaume-prod.github.io/cahier-app/favicon.png',
    tag: 'rappel-colis',
    renotify: true,
    vibrate: [250,120,250],
  };
  // Sur Android, les notifications doivent passer par le service worker
  if('serviceWorker' in navigator){
    navigator.serviceWorker.ready.then(reg=>reg.showNotification(titre, opts)).catch(()=>{
      try{ new Notification(titre, opts); }catch(e){}
    });
  } else {
    try{ new Notification(titre, opts); }catch(e){}
  }
}

// ── CLÔTURE AUTOMATIQUE ─────────────────────────────────────────
// Aprem → clôture à 01h00 / Matin → clôture à 09h00
let clotureAutoInterval = null;

function demarrerClotureAuto(){
  if(clotureAutoInterval) clearInterval(clotureAutoInterval);
  clotureAutoInterval = setInterval(verifierClotureAuto, 60*1000); // vérifie chaque minute
  verifierClotureAuto(); // vérification immédiate au démarrage
}

async function verifierClotureAuto(){
  // Le créneau de saisie vient de s'ouvrir : on charge la vacation
  if(S.agent && S.horsFenetre && fenetreSaisieOuverte(S.agent.equipe)){
    S.horsFenetre = false; S.loading = true; render();
    try{ await chargerTout(); }catch(e){ console.error(e); }
    S.loading = false; render();
    return;
  }
  if(!S.vacationId || !S.agent) return;
  const equipe = S.agent.equipe;
  if(!equipe) return;

  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const totalMin = h*60+m;

  // Seuils de clôture automatique
  // Aprem : clôture auto à 01h00 (si pas encore clôturée manuellement)
  // Matin : clôture auto à 09h00 (si pas encore clôturée manuellement)
  let doitClore = false;
  // Fenêtres de clôture : sinon la vacation se fermait dès l'ouverture de l'application pendant la vacation (ex. Aprem à 17h)
  if(equipe === 'Aprem' && !fenetreSaisieOuverte('Aprem')) doitClore = true; // de 01h00 à 16h00
  if(equipe === 'Matin' && !fenetreSaisieOuverte('Matin')) doitClore = true; // à partir de 09h00

  if(!doitClore) return;

  // Clôture automatique silencieuse
  console.log(`[ClôtureAuto] ${equipe} — ${h}h${String(m).padStart(2,'0')} → clôture automatique`);
  try{
    try{ await syncKPIVacationCourante(); }catch(e){}
    await db.patch('vacations_suivi',`id=eq.${S.vacationId}`,{terminee:true});
    clearInterval(clotureAutoInterval);
    clotureAutoInterval = null;
    arreterRappelColis();
    toast(`⏰ Vacation ${equipe} clôturée automatiquement (${h}h${String(m).padStart(2,'0')})`, 'ok');
    // Réinitialiser l'état local
    S.vacationId = null;
    S.epiValide = false;
    S.controles = [];
    S.colisData = [];
    S.epiData = [];
    S.anomalies = [];
    S.tournees = [];
    S.fiche = null;
    S.vue = 'epi';
    render();
  }catch(e){
    console.error('[ClôtureAuto] Erreur:', e);
  }
}

let rappelColisInterval = null;


// ── NOTIFICATIONS PUSH (rappel relevé colis, même application fermée) ──────
const VAPID_PUBLIC_KEY = 'BN8UfGgk2bYV5_A3knFlPb7kf_dWYZWGz4gXNHgY5jjTYfDjwfDASAiiLIeFhPb1RjLPFYHf6QpzaKVufjfA82Y';
function urlBase64ToUint8Array(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function inscrirePush(){
  try{
    if(!('serviceWorker' in navigator) || !('PushManager' in window) || Notification.permission !== 'granted' || !S.agent) return;
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
    const j = sub.toJSON();
    await db.post('push_subscriptions?on_conflict=endpoint', {agent_id:String(S.agent.id), equipe:S.agent.equipe||null, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth});
    window._pushActif = true;
  }catch(e){ console.error('Inscription push impossible', e); window._pushActif = false; }
}
async function desinscrirePush(){
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub){ await db.del('push_subscriptions', `endpoint=eq.${encodeURIComponent(sub.endpoint)}`); }
  }catch(e){}
  window._pushActif = false;
}

function programmmerProchainRappel(){ /* ancien mécanisme remplacé par verifierRappelColis() */ }

let dernierRappelLocal = 0;
const INTERVALLE_RAPPEL_MIN = 45;
function verifierRappelColis(){
  if(!S.agent || !S.vacationId || S.horsFenetre) return;
  const maintenant = Date.now();
  if(!dernierRappelLocal) dernierRappelLocal = maintenant; // point de départ : connexion à la vacation
  const dernierRelevé = Math.max(0, ...(S.colisData||[]).map(c=>c.created_at ? new Date(c.created_at.endsWith('Z')?c.created_at:c.created_at+'Z').getTime() : 0));
  const ref = Math.max(dernierRappelLocal, dernierRelevé);
  if(maintenant - ref < INTERVALLE_RAPPEL_MIN*60*1000) return;
  dernierRappelLocal = maintenant;
  if(!window._pushActif) envoyerNotif('📦 Rappel relevé colis', 'Pense à saisir le relevé colis !');
  toast('📦 Pense à saisir le relevé colis !','ok');
  try{ if(navigator.vibrate) navigator.vibrate([250,120,250]); }catch(e){}
}

function demarrerRappelColis(){
  if(rappelColisInterval) clearInterval(rappelColisInterval);
  rappelColisInterval = setInterval(verifierRappelColis, 30*1000);
  if(!window._rappelVisibilite){
    window._rappelVisibilite = true;
    // Quand le téléphone se réveille / l'application revient au premier plan : on rattrape un rappel manqué
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) verifierRappelColis(); });
  }
  verifierRappelColis();
}

function arreterRappelColis(){
  if(rappelColisInterval){
    clearInterval(rappelColisInterval);
    rappelColisInterval = null;
  }
}

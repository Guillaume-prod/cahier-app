.login-error{display:none;color:var(--rouge);font-size:13px;margin-top:8px;text-align:center;}

.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.07);}
.card-title{font-size:12px;font-weight:700;color:var(--texte-doux);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px;}

/* FORMS */
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--texte-doux);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em;}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--gris-bord);border-radius:10px;font-size:14px;font-family:inherit;background:white;color:var(--texte);outline:none;transition:border-color 0.2s;}
.form-input:focus{border-color:var(--bleu);}
select.form-input{cursor:pointer;}

.btn-primary{width:100%;padding:13px;background:var(--bleu);color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:opacity 0.2s;}
.btn-primary:active{opacity:0.85;}
.btn-secondary{width:100%;padding:11px;background:var(--gris);color:var(--texte);border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;}
.btn-ok{padding:8px 16px;background:var(--vert-pale);color:var(--vert);border:2px solid var(--vert);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-nok{padding:8px 16px;background:var(--rouge-pale);color:var(--rouge);border:2px solid var(--rouge);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-add{padding:8px 14px;background:var(--bleu-clair);color:var(--bleu);border:1.5px solid var(--bleu);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;}

/* NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--gris-bord);display:flex;z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 12px;cursor:pointer;font-size:10px;font-weight:600;color:var(--texte-doux);border:none;background:none;}
.nav-item.active{color:var(--bleu);}
.nav-item span{font-size:22px;margin-bottom:2px;}

/* BADGES */
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;}
.badge-ok{background:var(--vert-pale);color:var(--vert);}
.badge-nok{background:var(--rouge-pale);color:var(--rouge);}
.badge-matin{background:#e0f2fe;color:#0369a1;}
.badge-soiree{background:#ede9fe;color:#7c3aed;}

.stat-box{padding:12px;border-radius:10px;text-align:center;flex:1;}

.stat-box.nok{background:var(--rouge-pale);border:1.5px solid var(--rouge);}

// ── DB ──────────────────────────────────────────────────────────
async function sbFetch(method, path, body){
  // Jeton de l'utilisateur connecté (renouvelé automatiquement) ; sinon clé publique (avant connexion)
  let token = SUPABASE_KEY;
  try{ const { data } = await supabaseAuth.auth.getSession(); if(data && data.session) token = data.session.access_token; }catch(e){}
  const opts = {method, headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${token}`,'Content-Type':'application/json','Prefer':'return=representation'}};
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, opts);
  const t = await res.text();
  if(!res.ok) throw new Error(t);
  return t ? JSON.parse(t) : [];
}
const db = {

function fmtDate(d){ return new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}); }
function fmtHeure(iso){ if(!iso) return '—'; const d=new Date(iso.endsWith('Z')?iso:iso+'Z'); return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function getToday(){
  const now = new Date();
  // Date locale (pas UTC) pour éviter le décalage horaire
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function calcMoyenneSession(sessNum){
  // Moyenne globale pour une session (1er → dernier relevé avec heure + quantité)
  const data = S.colisData.filter(c=>c.quantite_colis&&c.heure_controle&&(c.session_numero||1)===sessNum);
  if(data.length < 2) return null;
  function toMinSess(h){ const [hh,mm]=h.split(':').map(Number); return hh*60+mm; }
  const sorted = [...data].sort((a,b)=>{
    let ma=toMinSess(a.heure_controle), mb=toMinSess(b.heure_controle);
    if(ma<360 && mb>1080) ma+=1440;
    if(mb<360 && ma>1080) mb+=1440;
    return ma-mb;
  });
  const first = sorted[0], last = sorted[sorted.length-1];
  let fMin = toMinSess(first.heure_controle), lMin = toMinSess(last.heure_controle);
  if(lMin < fMin) lMin += 1440; // passage minuit
  let dureeMin = lMin - fMin;
  if(dureeMin<=0) dureeMin+=24*60;
  const totalArret = last.arret_machine_cumul||0;
  const dureeEffective = Math.max(1, dureeMin - totalArret);
  const totalColis = last.quantite_colis - first.quantite_colis;
  if(totalColis<=0) return Math.round((last.quantite_colis/dureeEffective)*60);
  return Math.round((totalColis/dureeEffective)*60);
}

function calcMoyenneColis(){
  // Moyenne globale toutes sessions confondues
  const sessions = [...new Set(S.colisData.map(c=>c.session_numero||1))];
  const moyennes = sessions.map(s=>calcMoyenneSession(s)).filter(m=>m!==null);
  if(!moyennes.length) return null;
  return Math.round(moyennes.reduce((a,b)=>a+b,0)/moyennes.length);
}

function calcMoyenneLigne(sorted, index){
  // Vitesse entre la ligne précédente et la ligne actuelle
  if(index < 1) return null;
  const prev = sorted[index-1];
  const curr = sorted[index];
  if(!prev.quantite_colis || !curr.quantite_colis || !prev.heure_controle || !curr.heure_controle) return null;
  const [ph,pm] = prev.heure_controle.split(':').map(Number);
  const [ch,cm] = curr.heure_controle.split(':').map(Number);
  let dureeMin = (ch*60+cm)-(ph*60+pm);
  if(dureeMin<=0) dureeMin+=24*60;
  if(dureeMin===0) return null;
  const arretPrev = prev.arret_machine_cumul||0;
  const arretCurr = curr.arret_machine_cumul||0;
  const arretTranche = Math.max(0, arretCurr - arretPrev);
  const dureeEffective = Math.max(1, dureeMin - arretTranche);
  const diffColis = curr.quantite_colis - prev.quantite_colis;
  if(diffColis<=0) return null;
  return Math.round((diffColis/dureeEffective)*60);
}

function getMessageDuJour(){
  const today = getToday();
  // Utiliser la date pour choisir un message différent chaque jour
  const seed = today.replace(/-/g,'');
  const idx = parseInt(seed) % MESSAGES_BIENVENUE.length;
  return MESSAGES_BIENVENUE[idx];
}

}

// ── RENDER ─────────────────────────────────────────────────────
function render(){
  const app = document.getElementById('app');
  if(!S.agent){ app.innerHTML = renderLogin(); return; }
  if(S.loading){ app.innerHTML = `<div style="text-align:center;padding:60px;color:var(--texte-doux)">⏳ Chargement...</div>`; return; }
  if(S.vue==='bienvenue'){ app.innerHTML = renderBienvenue(); return; }
  if(S.vue==='choix-bienvenue'){ app.innerHTML = renderChoixBienvenue(); return; }
  if(S.vue==='blague'){ app.innerHTML = renderBlague(); return; }
  if(S.vue==='citation-bienvenue'){
    app.innerHTML = renderCitationBienvenue();
    // Machine à écrire sur la page citation
    const msg2 = getMessageDuJour();
    let j = 0; const texte2 = msg2.citation;
    function tapeCitation(){
      const typed = document.getElementById('bv-typed2');
      const cursor = document.getElementById('bv-cursor2');
      const auteur = document.getElementById('bv-auteur2');
      const btnGo = document.getElementById('btn-go-cit');
      if(!typed) return;
      if(j < texte2.length){ typed.textContent += texte2[j]; j++; setTimeout(tapeCitation, 28 + Math.random()*18); }
      else {
        if(cursor) cursor.style.display='none';
        if(auteur){auteur.style.transition='opacity 0.8s';auteur.style.opacity='1';}
        setTimeout(()=>{ if(btnGo) btnGo.style.display='block'; }, 800);
      }
    }
    setTimeout(tapeCitation, 300);
    return;
  }
  
  const nav = S.agent.est_responsable
    ? [['epi','🦺','EPI'],['chantiers','📋','Chantiers'],['colis','📦','Colis/h'],['anomalies','⚠️','Anomalies'],['pdf','📄','PDF'],['semaine','📊','Semaine'],['admin','⚙️','Admin']]
    : [['epi','🦺','EPI'],['chantiers','📋','Chantiers'],['colis','📦','Colis/h'],['anomalies','⚠️','Anomalies'],['pdf','📄','PDF']].concat(S.agent.equipe==='Matin'?[['semaine','📊','Semaine']]:[]);
  
  let content = '';
  if(S.vue==='epi') content = renderEPI();
  else if(S.vue==='code') content = renderChangerCode();
  else if(!S.epiValide && !S.agent.est_responsable) content = renderEPIBlocage();
  else if(S.vue==='chantiers') content = renderChantiers();
  else if(S.vue==='colis'){
    try{ content = renderColis(); }
    catch(e){ content = `<div class="card" style="background:#fee2e2;border:2px solid #dc2626"><div style="font-weight:700;color:#dc2626;margin-bottom:8px">❌ Erreur renderColis</div><div style="font-size:12px;font-family:monospace;white-space:pre-wrap">${e.message}\n\n${e.stack}</div></div>`; }
  }
  else if(S.vue==='anomalies') content = renderAnomalies();
  else if(S.vue==='pdf') content = renderPDF();
  else if(S.vue==='semaine') content = renderSemaine();
  else if(S.vue==='admin') content = renderAdmin();
  
  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-top:8px">
      <div>
        <div style="font-size:18px;font-weight:800;color:var(--bleu)">📓 Cahier MLH</div>
        <div style="font-size:12px;color:var(--texte-doux)">${S.agent.prenom} ${S.agent.nom} ${S.agent.equipe?'· '+S.agent.equipe:''}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:12px;color:var(--texte-doux)">${fmtDate(S.date).split(' ').slice(0,2).join(' ')}</div>
        <div style="display:flex;gap:8px">
        ${!S.agent.est_responsable?`<button onclick="setVue('code')" style="font-size:11px;color:var(--bleu);background:none;border:none;cursor:pointer;padding:0">🔑 Code</button>`:''}
        <button onclick="finVacation()" style="font-size:11px;color:var(--orange);background:none;border:none;cursor:pointer;padding:0">🏁 Fin</button>
        <button onclick="deconnexion()" style="font-size:11px;color:var(--rouge);background:none;border:none;cursor:pointer;padding:0">Déconnexion</button>
      </div>
      </div>
    </div>
    ${content}
    <nav class="bottom-nav">
      ${nav.map(([v,i,l])=>`<button class="nav-item ${S.vue===v?'active':''}" onclick="setVue('${v}')"><span>${i}</span>${l}</button>`).join('')}
    </nav>`;
}

// ── CHANTIERS ──────────────────────────────────────────────────
function renderSelectionAgentsChantier(n, c){
  // Agents de l'équipe en cours (pour Aprem/Soirée : fusionner)
  const equipe = S.agent.equipe || S.epiEquipeSelectionnee || '';
  let agents = [];
  if(equipe === 'Soirée' || equipe === 'Aprem'){
    agents = [...(PERSONNEL_DB['Aprem']||[]), ...(PERSONNEL_DB['Soirée']||[])];
  } else if(equipe === 'Matin'){
    agents = PERSONNEL_DB['Matin']||[];
  } else {
    // Admin sans équipe : tous les agents
    agents = Object.values(PERSONNEL_DB).flat();
  }

  // Noms déjà sélectionnés (stockés comme texte séparé par virgules)
  const dejaSelectionnes = (c.noms_chantier||'').split(',').map(s=>s.trim()).filter(Boolean);

  if(!agents.length) return `<input class="form-input" type="text" placeholder="Noms des agents" value="${c.noms_chantier||''}" onchange="sauvegarderControle(${n},'noms_chantier',this.value)" />`;

  return `<div style="background:var(--gris);border-radius:10px;padding:10px;max-height:200px;overflow-y:auto">
    ${agents.map(a=>{
      const nomComplet = `${a.nom} ${a.prenom}`;
      const key = `ch-${n}-${a.id}`;
      const checked = dejaSelectionnes.includes(nomComplet);
      return `<label style="display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;border-bottom:1px solid var(--gris-bord)">
        <input type="checkbox" id="${key}" ${checked?'checked':''} onchange="toggleAgentChantier(${n},this)" style="width:18px;height:18px;accent-color:var(--bleu);cursor:pointer" data-nom="${nomComplet}" />
        <span style="font-size:13px;font-weight:600">${a.nom} ${a.prenom}</span>
      </label>`;
    }).join('')}
  </div>`;
}

async function toggleAgentChantier(numControle, checkbox){
  const nom = checkbox.dataset.nom;
  const c = S.controles.find(x=>x.numero===numControle)||{};
  const dejaSelectionnes = (c.noms_chantier||'').split(',').map(s=>s.trim()).filter(Boolean);
  let nouveaux;
  if(checkbox.checked){
    nouveaux = [...dejaSelectionnes.filter(n=>n!==nom), nom];
  } else {
    nouveaux = dejaSelectionnes.filter(n=>n!==nom);
  }
  const valeur = nouveaux.join(', ');
  await sauvegarderControle(numControle, 'noms_chantier', valeur);
}

// ── COLIS/H ────────────────────────────────────────────────────
function renderColis(){
  const moyGlobale = calcMoyenneColis();
  const moyColor = moyGlobale ? (moyGlobale>=OBJECTIF_COLIS?'var(--vert)':'var(--rouge)') : 'var(--texte-doux)';
  const moyBg = moyGlobale ? (moyGlobale>=OBJECTIF_COLIS?'var(--vert-pale)':'var(--rouge-pale)') : 'var(--bleu-clair)';
  const labelGlobal = moyGlobale ? `${moyGlobale} colis/h` : '—';

  // Sessions existantes (au moins 1 entrée en DB) + session courante
  const sessionsExistantes = [...new Set(S.colisData.map(c=>c.session_numero||1))].sort((a,b)=>a-b);
  const maxSess = sessionsExistantes.length ? Math.max(...sessionsExistantes) : 0;
  const sessionCourante = S.sessionColisActive || maxSess || 1;
  const toutesLessions = sessionsExistantes.includes(sessionCourante) ? sessionsExistantes : [...sessionsExistantes, sessionCourante].sort((a,b)=>a-b);

  function renderSession(sessNum){
    // Nombre de lignes = max(5, lignes existantes en DB) + lignes ajoutées localement
    const lignesEnDB = S.colisData.filter(x=>(x.session_numero||1)===sessNum).map(x=>x.ligne_numero||1);
    const maxEnDB = lignesEnDB.length ? Math.max(...lignesEnDB) : 0;
    const nbLignes = Math.max(5, maxEnDB, S.lignesSession?.[sessNum]||0);
    const lignes = [];
    for(let i=1;i<=nbLignes;i++){
      const c = S.colisData.find(x=>(x.session_numero||1)===sessNum&&(x.ligne_numero||1)===i)||{};
      lignes.push({i, c});
    }
    function toMinRender(h){ const [hh,mm]=h.split(':').map(Number); return hh*60+mm; }
    const sorted = lignes.filter(({c})=>c.quantite_colis&&c.heure_controle).map(({c})=>c).sort((a,b)=>{
      let ma=toMinRender(a.heure_controle), mb=toMinRender(b.heure_controle);
      if(ma<360 && mb>1080) ma+=1440;
      if(mb<360 && ma>1080) mb+=1440;
      return ma-mb;
    });
    const moyS = calcMoyenneSession(sessNum);
    const mSColor = moyS ? (moyS>=OBJECTIF_COLIS?'var(--vert)':'var(--rouge)') : 'var(--texte-doux)';
    const mSBg = moyS ? (moyS>=OBJECTIF_COLIS?'var(--vert-pale)':'var(--rouge-pale)') : 'var(--gris)';

    return `<div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-weight:700;font-size:13px;color:var(--bleu)">📋 Session ${sessNum}</div>
        <div style="font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:${mSBg};color:${mSColor}">${moyS?`${moyS} colis/h`:'En attente'}</div>
      </div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
      <table class="table-suivi" style="min-width:480px;margin-bottom:0">
        <thead><tr>
          <th style="min-width:30px;text-align:center">#</th>
          <th style="position:sticky;left:0;background:white;z-index:2;min-width:50px">Quai</th>
          <th>Camion+H</th><th>H relevé</th><th>Qté colis</th><th>Colis/h</th><th>Arrêt(min)</th>
        </tr></thead>
        <tbody>
          ${lignes.map(({i,c})=>{
            const idx = c.id ? sorted.findIndex(x=>x.id===c.id) : -1;
            const moyL = idx>0 ? calcMoyenneLigne(sorted,idx) : null;
            const mLColor = moyL ? (moyL>=OBJECTIF_COLIS?'var(--vert)':'var(--rouge)') : 'var(--texte-doux)';
            const isAdmin = S.agent && S.agent.est_responsable;
            const heureLocked = !isAdmin && !!c.heure_controle;
            const colisLocked = !isAdmin && !!c.quantite_colis;
            const lockedStyle = 'background:var(--gris);color:var(--texte);border-color:transparent;cursor:not-allowed';
            return `<tr style="${c.quantite_colis&&c.quantite_colis<OBJECTIF_COLIS?'background:var(--rouge-pale)':''}">
              <td style="text-align:center;font-size:11px;color:var(--texte-doux);font-weight:700">${i}</td>
              <td style="position:sticky;left:0;background:${c.quantite_colis&&c.quantite_colis<OBJECTIF_COLIS?'#fee2e2':'white'};z-index:1">
                <input style="width:48px;border:1.5px solid var(--gris-bord);border-radius:6px;font-size:12px;font-weight:700;text-align:center;padding:4px 2px" type="text" placeholder="Q?" value="${c.quai||''}" onblur="sauvegarderColisLigne(${sessNum},${i},'quai',this.value)" />
              </td>
              <td><input style="width:76px;border:none;background:transparent;font-size:11px;text-align:center" type="text" placeholder="—" value="${c.camion_h_debut||''}" onblur="sauvegarderColisLigne(${sessNum},${i},'camion_h_debut',this.value)" /></td>
              <td>${heureLocked
                ? `<span style="display:inline-block;width:72px;text-align:center;font-size:12px;font-weight:700;color:var(--texte);background:var(--gris);border-radius:6px;padding:5px 4px;border:1.5px solid transparent">🔒 ${c.heure_controle}</span>`
                : `<input style="width:72px;border:1.5px solid var(--gris-bord);border-radius:6px;font-size:11px;text-align:center;padding:4px" type="time" value="${c.heure_controle||''}" onchange="sauvegarderColisLigne(${sessNum},${i},'heure_controle',this.value)" />`
              }</td>
              <td>${colisLocked
                ? `<span style="display:inline-block;width:80px;text-align:center;font-size:14px;font-weight:700;color:var(--texte);background:var(--gris);border-radius:8px;padding:6px 4px;border:1.5px solid transparent">🔒 ${c.quantite_colis}</span>`
                : `<input style="width:80px;border:1.5px solid var(--gris-bord);border-radius:8px;background:white;font-size:14px;font-weight:700;text-align:center;padding:5px 3px" type="number" placeholder="—" value="${c.quantite_colis||''}" onblur="sauvegarderColisLigne(${sessNum},${i},'quantite_colis',parseInt(this.value)||null)" />`
              }</td>
              <td style="font-weight:700;color:${mLColor};font-size:12px;text-align:center;white-space:nowrap">${moyL?`${moyL}`:'—'}</td>
              <td><input style="width:55px;border:1.5px solid var(--gris-bord);border-radius:8px;background:white;font-size:12px;text-align:center;padding:4px 2px" type="number" placeholder="0" value="${c.arret_machine_cumul||''}" onblur="sauvegarderColisLigne(${sessNum},${i},'arret_machine_cumul',parseInt(this.value)||0)" /></td>
            </tr>
            ${(c.cadence_ok===false)?`<tr style="background:var(--orange-pale)"><td colspan="7" style="padding:2px 4px"><input style="width:100%;border:none;background:transparent;font-size:11px;padding:3px" type="text" placeholder="Cause cadence NOK..." value="${c.raison_non_atteinte||''}" onblur="sauvegarderColisLigne(${sessNum},${i},'raison_non_atteinte',this.value)" /></td></tr>`:''}`;
          }).join('')}
        </tbody>
      </table>
      </div>
      <button onclick="ajouterLigneColis(${sessNum})" style="margin-top:6px;padding:6px 14px;background:var(--bleu-clair);color:var(--bleu);border:1.5px solid var(--bleu);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer">＋ Ligne</button>
    </div>`;
  }

  const maxSession = toutesLessions.length ? Math.max(...toutesLessions) : 0;

  return `<div class="card">
    <div class="card-title">📦 Contrôle Colis/H — Objectif ${OBJECTIF_COLIS} colis/h</div>
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <div class="stat-box info" style="background:${moyBg};border-color:${moyColor}">
        <div class="stat-val" style="color:${moyColor};font-size:18px">${labelGlobal}</div>
        <div class="stat-label" style="color:${moyColor}">Moyenne globale</div>
      </div>
      <div class="stat-box ok">
        <div class="stat-val" style="color:var(--vert)">${OBJECTIF_COLIS}</div>
        <div class="stat-label" style="color:var(--vert)">Objectif</div>

function ajouterLigneColis(sessNum){
  if(!S.lignesSession) S.lignesSession = {};
  const lignesEnDB = S.colisData.filter(x=>(x.session_numero||1)===sessNum).map(x=>x.ligne_numero||1);
  const maxEnDB = lignesEnDB.length ? Math.max(...lignesEnDB) : 0;
  const actuel = Math.max(5, maxEnDB, S.lignesSession[sessNum]||0);
  S.lignesSession[sessNum] = actuel + 1;

async function toggleEPI(nom, checked){
  const manquements = (S.epiData||[]).filter(e=>e.nom_prenom!=='RAS');

  render();
}

async function chargerArchives(date){

  // Pour chaque vacation, charger contrôles, colis, EPI
  const details = await Promise.all(vacs.map(async v=>{
    const agent = (S.tousAgents||[]).find(a=>a.id===v.agent_id)||{prenom:'?',nom:'',equipe:''};
    const controles = await db.get('controles_chantiers',`vacation_id=eq.${v.id}&order=numero.asc`);

    return {vacation:v, agent, controles, colis, epi, tournees};

  render();
}

function calcMoyenneColisArchive(colisData){
  const sessions = [...new Set(colisData.map(c=>c.session_numero||1))];
  const moyennes = sessions.map(sessNum=>{
    const data = colisData.filter(c=>c.quantite_colis&&c.heure_controle&&(c.session_numero||1)===sessNum);
    if(data.length<1) return null;
    function toMinArch(h){ const [hh,mm]=h.split(':').map(Number); return hh*60+mm; }
    const sorted = [...data].sort((a,b)=>{
      let ma=toMinArch(a.heure_controle), mb=toMinArch(b.heure_controle);
      if(ma<360 && mb>1080) ma+=1440;
      if(mb<360 && ma>1080) mb+=1440;
      return ma-mb;
    });
    const first = sorted[0], last = sorted[sorted.length-1];
    let fMinA=toMinArch(first.heure_controle), lMinA=toMinArch(last.heure_controle);
    if(lMinA<fMinA) lMinA+=1440;
    let duree = lMinA - fMinA;
    if(duree<=0) duree+=24*60;
    const arret = last.arret_machine_cumul||0;
    const dureeEff = Math.max(1,duree-arret);
    const totalColis = last.quantite_colis - (data.length>1?first.quantite_colis:0);
    if(totalColis<=0) return Math.round((last.quantite_colis/dureeEff)*60);
    return Math.round((totalColis/dureeEff)*60);
  }).filter(m=>m!==null);
  if(!moyennes.length) return null;
  return Math.round(moyennes.reduce((a,b)=>a+b,0)/moyennes.length);
}

async function connexion(){
  const prenom = document.getElementById('login-prenom')?.value.trim();
  const mdp = document.getElementById('login-code')?.value.trim();
  if(!prenom||!mdp){ document.getElementById('login-error').style.display='block'; return; }
  try{
    // Trouver l'email correspondant au prénom dans la table agents
    // Avant connexion, seule la fonction email_pour_prenom est accessible (la table agents est protégée)
    const emailTrouve = await sbFetch('POST','rpc/email_pour_prenom',{p_prenom:prenom});
    if(!emailTrouve){ document.getElementById('login-error').style.display='block'; return; }
    // Connexion via Supabase Auth
    const { data, error } = await supabaseAuth.auth.signInWithPassword({
      email: emailTrouve,
      password: mdp
    });
    if(error){ document.getElementById('login-error').style.display='block'; return; }
    // Une fois connecté, on lit la fiche de l'agent normalement
    const agentRes = await db.get('agents',`email=eq.${encodeURIComponent(emailTrouve)}&select=*`);
    if(!agentRes.length){ document.getElementById('login-error').style.display='block'; return; }
    const agentData = agentRes[0];
    S.agent = agentData;
    S.authSession = data.session;
    S.loading = true; render();
    await chargerTout();
    S.loading = false;
    // Afficher la page de bienvenue à la première connexion du jour
    if(doitAfficherBienvenue()){
      S.vue = 'bienvenue';
    }
    render();
    await demanderPermissionNotif();
    demarrerRappelColis();
    demarrerClotureAuto();
  }catch(e){ toast('Erreur connexion','err'); console.error(e); }
}

// ── CHARGEMENT ─────────────────────────────────────────────────
async function chargerTout(){
  await getOrCreateVacation();
  await Promise.all([chargerControles(), chargerColis(), chargerEPI(), chargerAgentsPersonnel(), chargerAnomalies()]);
  if(S.agent.est_responsable) S.tousAgents = await db.get('agents','select=id,prenom,nom,equipe,email,est_responsable&order=nom.asc');
}

async function chargerAgentsPersonnel(){
  try{
    const tous = await db.get('agents','select=id,prenom,nom,equipe&equipe=not.is.null&order=nom.asc');
    PERSONNEL_DB = {};
    tous.forEach(a=>{
      const eq = a.equipe;
      if(!PERSONNEL_DB[eq]) PERSONNEL_DB[eq] = [];
      PERSONNEL_DB[eq].push(a);
    });
  }catch(e){ console.error('Erreur chargement agents',e); }
}

async function getOrCreateVacation(){
  const equipe = S.agent.equipe || 'Toutes';
  // Chercher sur les 2 derniers jours pour gérer le passage minuit (équipe d'aprem)
  const hier = new Date(Date.now() - 36*60*60*1000);
  const hierStr = `${hier.getFullYear()}-${String(hier.getMonth()+1).padStart(2,'0')}-${String(hier.getDate()).padStart(2,'0')}`;
  let vacs = await db.get('vacations_suivi',`agent_id=eq.${S.agent.id}&date=gte.${hierStr}&order=created_at.desc&select=*`);
  // Prendre la vacation active la plus récente (non terminée)
  const vacActive = vacs.find(v=>!v.terminee);
  if(!vacActive){
    const created = await db.post('vacations_suivi',{agent_id:S.agent.id, equipe, date:S.date});
    S.vacationId = created[0].id;
    // S.date reste aujourd'hui
  } else {
    S.vacationId = vacActive.id;
    // Utiliser la date de la vacation trouvée (important après minuit)
    S.date = vacActive.date;
  }
}

async function chargerControles(){
  S.controles = await db.get('controles_chantiers',`vacation_id=eq.${S.vacationId}&order=numero.asc`);
  const ids = S.controles.map(c=>c.id);
  if(ids.length){
    S.tournees = await db.get('tournees',`controle_id=in.(${ids.join(',')})&order=numero.asc`);
  } else { S.tournees = []; }
}

async function chargerColis(){
  S.colisData = await db.get('controles_colis',`vacation_id=eq.${S.vacationId}&order=created_at.asc`);
}

async function chargerEPI(){
  S.epiData = await db.get('epi',`vacation_id=eq.${S.vacationId}&order=created_at.asc`);
  const vac = await db.get('vacations_suivi',`id=eq.${S.vacationId}&select=epi_valide`);
  S.epiValide = vac[0]?.epi_valide || false;
}

async function chargerAnomalies(){
  if(!S.vacationId){ S.anomalies = []; return; }
  S.anomalies = await db.get('anomalies',`vacation_id=eq.${S.vacationId}&order=created_at.asc`);
}

async function sauvegarderControle(num, champ, valeur){
  try{
    let c = S.controles.find(x=>x.numero===num);
    if(!c){
      const created = await db.post('controles_chantiers',{vacation_id:S.vacationId, numero:num, [champ]:valeur});
      S.controles.push(created[0]);
    } else {
      await db.patch('controles_chantiers',`id=eq.${c.id}`,{[champ]:valeur});
      c[champ] = valeur;
    }
  }catch(e){ toast('Erreur sauvegarde','err'); }
}

async function sauvegarderTournee(numControle, numTournee, champ, valeur){
  try{
    let c = S.controles.find(x=>x.numero===numControle);
    if(!c){
      const created = await db.post('controles_chantiers',{vacation_id:S.vacationId, numero:numControle});
      c = created[0]; S.controles.push(c);
    }
    let t = S.tournees ? S.tournees.find(x=>x.controle_id===c.id&&x.numero===numTournee) : null;
    if(!t){
      const created = await db.post('tournees',{controle_id:c.id, numero:numTournee, [champ]:valeur});
      if(!S.tournees) S.tournees = [];
      S.tournees.push(created[0]);
    } else {
      await db.patch('tournees',`id=eq.${t.id}`,{[champ]:valeur});
      t[champ] = valeur;
    }
    if(champ==='resultat') render();
  }catch(e){ toast('Erreur sauvegarde','err'); }
}

// ── SAUVEGARDE COLIS ────────────────────────────────────────────
async function sauvegarderColisLigne(sessNum, ligneNum, champ, valeur){
  try{
    if(!S.vacationId){ toast('Session non initialisée','err'); return; }
    let c = S.colisData.find(x=>(x.session_numero||1)===sessNum&&(x.ligne_numero||1)===ligneNum);
    const now = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    const autoHeure = (champ==='quantite_colis' && valeur && (!c||!c.heure_controle)) ? now : null;
    // Calcul cadence basé sur la vitesse inter-lignes (colis/h) et non la quantité brute
    let autoCadence = null;
    if(champ==='quantite_colis' && valeur!=null){
      // Chercher la ligne précédente dans la même session pour calculer la cadence réelle
      const sessNum2 = c ? (c.session_numero||1) : sessNum;
      const ligneNum2 = c ? (c.ligne_numero||1) : ligneNum;
      const lignesPrecedentes = S.colisData.filter(x=>
        (x.session_numero||1)===sessNum2 &&
        (x.ligne_numero||1) < ligneNum2 &&
        x.quantite_colis && x.heure_controle
      ).sort((a,b)=>(a.ligne_numero||1)-(b.ligne_numero||1));
      const prev = lignesPrecedentes[lignesPrecedentes.length-1];
      if(prev && prev.heure_controle){
        const heureActuelle = autoHeure || (c&&c.heure_controle) || now;
        const [ph,pm] = prev.heure_controle.split(':').map(Number);
        const [ch2,cm2] = heureActuelle.split(':').map(Number);
        let dureeMin = (ch2*60+cm2)-(ph*60+pm);
        if(dureeMin<=0) dureeMin+=24*60;
        if(dureeMin>0){
          const diffColis = valeur - prev.quantite_colis;
          if(diffColis>0){
            const cadenceCalc = Math.round((diffColis/dureeMin)*60);
            autoCadence = cadenceCalc >= OBJECTIF_COLIS;
          } else {
            autoCadence = false;
          }
        }
      } else {
        // Première ligne de la session : pas de précédent, on ne peut pas juger
        autoCadence = null;
      }
    }

    if(!c){
      const body = {vacation_id:S.vacationId, session_numero:sessNum, ligne_numero:ligneNum, tranche:`S${sessNum}-L${ligneNum}`, [champ]:valeur};
      if(autoHeure) body.heure_controle = autoHeure;
      if(autoCadence!==null) body.cadence_ok = autoCadence;
      const created = await db.post('controles_colis', body);
      if(created && created[0]) S.colisData.push(created[0]);
    } else {
      const body = {[champ]:valeur};
      if(autoHeure) body.heure_controle = autoHeure;
      if(autoCadence!==null) body.cadence_ok = autoCadence;
      await db.patch('controles_colis',`id=eq.${c.id}`, body);
      c[champ] = valeur;
      if(autoHeure) c.heure_controle = autoHeure;
      if(autoCadence!==null) c.cadence_ok = autoCadence;
    }
    // Re-render pour mettre à jour moyennes (seulement après blur, pas pendant saisie)
    if(champ !== 'quai' && champ !== 'camion_h_debut' && champ !== 'raison_non_atteinte') render();
  }catch(e){ toast('Erreur: '+e.message,'err'); console.error('sauvegarderColisLigne',e); }
}

  try{
    await db.del('anomalies',`id=eq.${id}`);
    S.anomalies = S.anomalies.filter(a=>a.id!==id);
    render();
  }catch(e){ toast('Erreur suppression','err'); }
}

async function modifierAnomalie(id, champ, valeur){
  try{
    await db.patch('anomalies',`id=eq.${id}`,{[champ]:valeur});
    const a = S.anomalies.find(x=>x.id===id);
    if(a){ a[champ]=valeur; if(champ==='type_anomalie') render(); }
  }catch(e){ toast('Erreur sauvegarde','err'); }
}

function ajouterPhotoAnomalie(id, input){
  const file = input.files[0];
  if(!file) return;
  // Redimensionner avant encodage pour limiter la taille
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const MAX = 1200;
      let w = img.width, h = img.height;
      if(w > MAX){ h = Math.round(h*MAX/w); w = MAX; }
      if(h > MAX){ w = Math.round(w*MAX/h); h = MAX; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const base64 = canvas.toDataURL('image/jpeg', 0.82);
      modifierAnomalie(id, 'photo_base64', base64);
      const a = S.anomalies.find(x=>x.id===id);
      if(a){ a.photo_base64 = base64; render(); }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ── PARTAGE PDF + RÉCAP SEMAINE ────────────────────────────────
function escHtml(t){ return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nomFichierPDF(){
  const eq = (S.agent && S.agent.equipe) ? S.agent.equipe : 'Cahier';
  return `Cahier_${eq}_${(S.date||'').replace(/[^0-9-]/g,'')||'jour'}.pdf`;
}
async function partagerPDF(nom){
  const el = document.getElementById('pdf-content');
  if(!el) return;
  nom = (typeof nom==='string' && nom) ? nom : (window._nomPdfPartage || nomFichierPDF());
  if(typeof html2pdf==='undefined'){ toast('Module PDF non chargé (vérifiez la connexion)','err'); return; }
  toast('Préparation du PDF…','ok');
  try{
    const blob = await html2pdf().set({
      margin:8, filename:nom, image:{type:'jpeg',quality:0.85},
      html2canvas:{scale:1.5,useCORS:true}, jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['css','legacy']}
    }).from(el).outputPdf('blob');
    const file = new File([blob], nom, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:nom.replace('.pdf',''), text: window._texteResume || ('La Poste Mulhouse — '+nom.replace('.pdf','').replace(/_/g,' '))});
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nom;
      document.body.appendChild(a); a.click(); a.remove();
      toast('PDF téléchargé','ok');
    }
  }catch(e){
    if(e && e.name==='AbortError') return;
    toast('Erreur lors de la création du PDF','err'); console.error(e);
  }
}
async function copierResume(){
  try{ await navigator.clipboard.writeText(window._texteResume||''); toast('Résumé copié : collez-le dans le mail','ok'); }
  catch(e){ toast('Copie impossible','err'); }
}
function lundiDe(d){ const x=new Date(d); const j=(x.getDay()+6)%7; x.setDate(x.getDate()-j); return x; }
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

    ${S.epiData.filter(e=>e.nom_prenom!=='RAS').map(e=>`<tr style="border-bottom:1px solid #eee"><td style="padding:6px">${e.nom_prenom}</td><td style="padding:6px;color:#dc2626;font-weight:bold">${e.epi_manquant}</td><td style="padding:6px">${e.solution||'—'}</td></tr>`).join('')}

  ${(S.anomalies||[]).length?`
  <table style="width:100%;border-collapse:collapse;margin-bottom:10px">
    <tr style="background:#d97706;color:white"><th style="padding:6px">Type</th><th style="padding:6px">Brin</th><th style="padding:6px">Description</th><th style="padding:6px">Photo</th></tr>
    ${(S.anomalies||[]).map(a=>{

  // Créer une page d'impression dans l'app
  const overlay = document.createElement('div');

function fermerPDF(){
  window._nomPdfPartage = null; window._texteResume = null;

// ── RAPPORT DE NUIT CONSOLIDÉ ────────────────────────────────────
function confirmerRapportNuit(){
  const input = document.getElementById('date-rapport-nuit');
  const dateAprem = input ? input.value : S.date;
  if(!dateAprem){ toast('Sélectionne une date','err'); return; }

  // Calculer J+1 pour le Matin
  const d = new Date(dateAprem);
  d.setDate(d.getDate()+1);
  const dateMatin = d.toISOString().slice(0,10);

  // Confirmation
  const ok = confirm(`Générer le rapport de nuit ?\n\n🌆 Aprem du ${fmtDate(dateAprem)}\n☀️ Matin du ${fmtDate(dateMatin)}\n\nCela va charger les données depuis la base.`);
  if(ok) exporterRapportNuit(dateAprem, dateMatin);
}

async function exporterRapportNuit(dateAprem, dateMatin){
  toast('⏳ Chargement des données…','info');

  try{
    // Charger vacation Aprem de J (terminée ou non)
    const vacsAprem = await db.get('vacations_suivi',`date=eq.${dateAprem}&equipe=eq.Aprem&select=*&order=created_at.desc`);
    // Charger vacation Matin de J+1 (terminée ou non)
    const vacsMatin = await db.get('vacations_suivi',`date=eq.${dateMatin}&equipe=eq.Matin&select=*&order=created_at.desc`);

    // Charger les détails de chaque vacation
    async function chargerDetails(vacs){
      if(!vacs.length) return null;
      const v = vacs[0]; // On prend la première (en cas de doublon)
      const agent = (S.tousAgents||[]).find(a=>a.id===v.agent_id)||{prenom:'?',nom:'',equipe:v.equipe||''};
      const controles = await db.get('controles_chantiers',`vacation_id=eq.${v.id}&order=numero.asc`);
      const colis = await db.get('controles_colis',`vacation_id=eq.${v.id}&order=created_at.asc`);
      const epi = await db.get('epi',`vacation_id=eq.${v.id}&order=created_at.asc`);
      const anomalies = await db.get('anomalies',`vacation_id=eq.${v.id}&order=created_at.asc`);
      const ids = controles.map(c=>c.id);
      const tournees = ids.length ? await db.get('tournees',`controle_id=in.(${ids.join(',')})&order=numero.asc`) : [];
      return {vacation:v, agent, controles, colis, epi, anomalies, tournees};
    }

    const detailAprem = await chargerDetails(vacsAprem);
    const detailMatin = await chargerDetails(vacsMatin);

    if(!detailAprem && !detailMatin){
      toast('Aucune vacation trouvée pour ces dates','err');
      return;
    }

    // Générer le HTML de chaque section
    function htmlVacation(d, label, emoji, dateStr){
      if(!d) return `<div style="page-break-before:always;padding:20px;font-family:Arial,sans-serif;font-size:12px">
        <h2 style="color:#6b7280">${emoji} ${label} — ${dateStr}</h2>
        <p style="color:#9ca3af;margin-top:12px">Aucune donnée saisie pour cette vacation.</p>
      </div>`;

      function toMinN(h){ const [hh,mm]=h.split(':').map(Number); return hh*60+mm; }
      // Calcul moyenne colis
      const sessions = [...new Set(d.colis.map(c=>c.session_numero||1))];
      const moyennes = sessions.map(sessNum=>{
        const data = d.colis.filter(c=>c.quantite_colis&&c.heure_controle&&(c.session_numero||1)===sessNum);
        if(data.length<2) return null;
        const sorted2 = [...data].sort((a,b)=>{
          let ma=toMinN(a.heure_controle),mb=toMinN(b.heure_controle);
          if(ma<360&&mb>1080)ma+=1440; if(mb<360&&ma>1080)mb+=1440;
          return ma-mb;
        });
        const first=sorted2[0],last=sorted2[sorted2.length-1];
        let fM=toMinN(first.heure_controle),lM=toMinN(last.heure_controle);
        if(lM<fM)lM+=1440;
        const duree=Math.max(1,lM-fM-(last.arret_machine_cumul||0));
        const total=last.quantite_colis-first.quantite_colis;
        return total>0?Math.round((total/duree)*60):Math.round((last.quantite_colis/duree)*60);
      }).filter(m=>m!==null);
      const moy = moyennes.length?Math.round(moyennes.reduce((a,b)=>a+b,0)/moyennes.length):null;
      const moyOk = moy && moy >= OBJECTIF_COLIS;

      return `<div style="font-family:Arial,sans-serif;padding:20px;max-width:800px;margin:0 auto;font-size:12px">
        <div style="display:flex;align-items:center;gap:12px;border-bottom:3px solid #1a56a0;padding-bottom:10px;margin-bottom:14px">
          <span style="font-size:28px">${emoji}</span>
          <div>
            <h2 style="color:#1a56a0;font-size:16px;margin:0">${label} — ${dateStr}</h2>
            <p style="color:#5a6478;font-size:11px;margin:2px 0 0">Chef d'équipe : ${d.agent.prenom} ${d.agent.nom} · Equipe ${d.vacation.equipe||label}</p>
          </div>
          ${moy?`<div style="margin-left:auto;padding:6px 14px;border-radius:8px;font-weight:700;font-size:13px;background:${moyOk?'#dcfce7':'#fee2e2'};color:${moyOk?'#16a34a':'#dc2626'}">${moy} colis/h ${moyOk?'✅':'❌'}</div>`:''}
        </div>

        <h3 style="color:#1a56a0;font-size:13px;margin:14px 0 8px;border-left:4px solid #1a56a0;padding-left:8px">📦 Relevés Colis/H — Objectif ${OBJECTIF_COLIS} colis/h</h3>
        ${d.colis.filter(c=>c.quantite_colis).length?`
        <table style="width:100%;border-collapse:collapse;margin-bottom:10px;font-size:11px">
          <tr style="background:#1a56a0;color:white">
            <th style="padding:5px 6px">Session</th><th style="padding:5px 6px">Ligne</th>
            <th style="padding:5px 6px">Camion</th><th style="padding:5px 6px">H relevé</th>
            <th style="padding:5px 6px">Quantité</th><th style="padding:5px 6px">Cadence</th>
            <th style="padding:5px 6px">Raison NOK</th>
          </tr>
          ${d.colis.filter(c=>c.quantite_colis).map(c=>`
          <tr style="border-bottom:1px solid #eee">
            <td style="padding:5px 6px;text-align:center">${c.session_numero||1}</td>
            <td style="padding:5px 6px;text-align:center">${c.ligne_numero||1}</td>
            <td style="padding:5px 6px">${c.camion_h_debut||'—'}</td>
            <td style="padding:5px 6px">${c.heure_controle||'—'}</td>
            <td style="padding:5px 6px;font-weight:bold;text-align:center">${c.quantite_colis}</td>
            <td style="padding:5px 6px;text-align:center;color:${c.cadence_ok!==false?'#16a34a':'#dc2626'};font-weight:bold">${c.cadence_ok!==false?'✅ OK':'❌ NOK'}</td>
            <td style="padding:5px 6px;color:#dc2626">${c.cadence_ok===false&&c.raison_non_atteinte?c.raison_non_atteinte:'—'}</td>
          </tr>`).join('')}
        </table>`:'<p style="color:#9ca3af">Aucune donnée colis saisie.</p>'}

        <h3 style="color:#1a56a0;font-size:13px;margin:14px 0 8px;border-left:4px solid #1a56a0;padding-left:8px">📋 Vérification des Chantiers</h3>
        ${d.controles.length?d.controles.map(c=>{
          const trn=(d.tournees||[]).filter(t=>t.controle_id===c.id);
          return `<div style="background:#f4f6f9;padding:8px 10px;border-radius:6px;margin-bottom:8px">
            <strong>Contrôle N°${c.numero}</strong> — Brin: ${c.brin||'—'} — Heure: ${c.heure_controle||'—'} — Agents: ${c.noms_chantier||'—'}
            ${trn.length?`<table style="width:100%;border-collapse:collapse;margin-top:6px;font-size:11px">
              <tr style="background:#1a56a0;color:white"><th style="padding:4px 6px">N°</th><th style="padding:4px 6px">Contenant</th><th style="padding:4px 6px">Résultat</th><th style="padding:4px 6px">Erreurs</th><th style="padding:4px 6px">Solutions</th></tr>
              ${trn.map(t=>`<tr style="border-bottom:1px solid #eee">
                <td style="padding:4px 6px">${t.numero}</td><td style="padding:4px 6px">${t.contenant||'—'}</td>
                <td style="padding:4px 6px;color:${t.resultat==='OK'?'#16a34a':'#dc2626'};font-weight:bold">${t.resultat||'—'}</td>
                <td style="padding:4px 6px">${t.erreurs||'—'}</td><td style="padding:4px 6px">${t.solutions||'—'}</td>
              </tr>`).join('')}
            </table>`:'<p style="font-size:11px;color:#9ca3af;margin-top:4px">Aucune tournée saisie.</p>'}
          </div>`;
        }).join(''):'<p style="color:#9ca3af">Aucun contrôle chantier saisi.</p>'}

        <h3 style="color:#1a56a0;font-size:13px;margin:14px 0 8px;border-left:4px solid #1a56a0;padding-left:8px">🦺 Contrôle EPI</h3>
        ${d.epi.filter(e=>e.nom_prenom&&e.nom_prenom!=='RAS').length?`
        <table style="width:100%;border-collapse:collapse;font-size:11px">
          <tr style="background:#1a56a0;color:white"><th style="padding:5px 6px">Nom + Prénom</th><th style="padding:5px 6px">EPI manquant</th><th style="padding:5px 6px">Solution apportée</th></tr>
          ${d.epi.filter(e=>e.nom_prenom&&e.nom_prenom!=='RAS').map(e=>`
          <tr style="border-bottom:1px solid #eee">
            <td style="padding:5px 6px">${e.nom_prenom}</td>
            <td style="padding:5px 6px;color:#dc2626;font-weight:bold">${e.epi_manquant||'—'}</td>
            <td style="padding:5px 6px">${e.solution||'—'}</td>
          </tr>`).join('')}
        </table>`:'<p style="color:#16a34a;font-weight:bold">✅ Aucun manquement EPI.</p>'}

        <h3 style="color:#d97706;font-size:13px;margin:14px 0 8px;border-left:4px solid #d97706;padding-left:8px">⚠️ Anomalies</h3>
        ${(d.anomalies||[]).length?`
        <table style="width:100%;border-collapse:collapse;font-size:11px">
          <tr style="background:#d97706;color:white"><th style="padding:5px 6px">Type</th><th style="padding:5px 6px">Brin</th><th style="padding:5px 6px">Description</th><th style="padding:5px 6px">Photo</th></tr>
          ${(d.anomalies||[]).map(a=>{
            const type=TYPES_ANOMALIE.find(t=>t.code===a.type_anomalie)||TYPES_ANOMALIE[TYPES_ANOMALIE.length-1];
            return `<tr style="border-bottom:1px solid #eee;vertical-align:top">
              <td style="padding:5px 6px;font-weight:700;color:${type.couleur};white-space:nowrap">${type.label}</td>
              <td style="padding:5px 6px">${a.brin_mep||'—'}</td>
              <td style="padding:5px 6px">${a.description||'—'}</td>
              <td style="padding:5px 6px">${a.photo_base64?`<img src="${a.photo_base64}" style="max-width:100px;max-height:80px;border-radius:4px" />`:'—'}</td>
            </tr>`;
          }).join('')}
        </table>`:'<p style="color:#16a34a;font-weight:bold">✅ Aucune anomalie signalée.</p>'}
      </div>`;
    }

    const contenu = `
      <div style="font-family:Arial,sans-serif;padding:20px;max-width:800px;margin:0 auto">
        <div style="text-align:center;border-bottom:3px solid #1a56a0;padding-bottom:12px;margin-bottom:4px">
          <h1 style="color:#1a56a0;font-size:20px;margin:0">🌙 Rapport de Nuit — La Poste Mulhouse</h1>
          <p style="color:#5a6478;font-size:12px;margin:4px 0 0">🌆 Aprem ${fmtDate(dateAprem)} → ☀️ Matin ${fmtDate(dateMatin)}</p>
        </div>
      </div>
      ${htmlVacation(detailAprem, 'Équipe Aprem', '🌆', fmtDate(dateAprem))}
      <div style="page-break-before:always"></div>
      ${htmlVacation(detailMatin, 'Équipe Matin', '☀️', fmtDate(dateMatin))}
    `;

    const overlay = document.createElement('div');
    overlay.id = 'pdf-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:white;z-index:999;overflow-y:auto;padding:0';
    overlay.innerHTML = `
      <div style="position:sticky;top:0;background:#6366f1;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10">
        <span style="color:white;font-weight:700;font-size:15px">🌙 Rapport de nuit</span>
        <div style="display:flex;gap:8px">
          <button onclick="partagerPDF()" style="padding:8px 16px;background:#16a34a;color:white;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer">📤 Partager</button>
        <button onclick="window.print()" style="padding:8px 16px;background:white;color:#6366f1;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer">🖨️ Imprimer</button>
          <button onclick="fermerPDF()" style="padding:8px 14px;background:rgba(255,255,255,0.2);color:white;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer">✕ Fermer</button>
        </div>
      </div>
      <div id="pdf-content">${contenu}</div>
    `;
    document.body.appendChild(overlay);

    const style = document.createElement('style');
    style.id = 'print-style';
    style.textContent = `@media print { body > *:not(#pdf-overlay) { display:none !important; } #pdf-overlay > div:first-child { display:none !important; } #pdf-overlay { position:static !important; } @page { margin: 1.5cm; } }`;
    document.head.appendChild(style);

  }catch(e){
    toast('Erreur lors du chargement : '+e.message,'err');
  }
}

render();

// ── SERVICE WORKER ────────────────────────────────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/cahier-app/sw.js').then(reg=>{
    console.log('SW registered');
    // Forcer la mise à jour immédiate du SW à chaque chargement
    reg.update();
    if(reg.waiting){ reg.waiting.postMessage({type:'SKIP_WAITING'}); }
    reg.addEventListener('updatefound', ()=>{
      const newSW = reg.installing;
      if(newSW){ newSW.addEventListener('statechange', ()=>{
        if(newSW.state==='installed' && navigator.serviceWorker.controller){
          newSW.postMessage({type:'SKIP_WAITING'});
        }
      }); }
    });
  }).catch(e=>console.warn('SW error', e));
  
  // Écouter les messages du SW pour reprogrammer
  navigator.serviceWorker.addEventListener('message', e=>{
    if(e.data && e.data.type==='RESCHEDULE'){
      programmmerProchainRappel();
    }
  });
}

// ── NOTIFICATIONS ─────────────────────────────────────────────
async function demanderPermissionNotif(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default'){
    await Notification.requestPermission();
  }
}

function envoyerNotif(titre, corps){
  if(Notification.permission !== 'granted') return;
  const notif = new Notification(titre, {
    body: corps,
    icon: 'https://guillaume-prod.github.io/cahier-app/favicon.png',
    badge: 'https://guillaume-prod.github.io/cahier-app/favicon.png',
    tag: 'rappel-colis',
    renotify: true,
  });
  notif.onclick = () => {
    window.focus();
    S.vue = 'colis';
    render();
    notif.close();
  };
}

// ── CLÔTURE AUTOMATIQUE ─────────────────────────────────────────
// Aprem → clôture à 01h00 / Matin → clôture à 08h00
let clotureAutoInterval = null;

function demarrerClotureAuto(){
  if(clotureAutoInterval) clearInterval(clotureAutoInterval);
  clotureAutoInterval = setInterval(verifierClotureAuto, 60*1000); // vérifie chaque minute
  verifierClotureAuto(); // vérification immédiate au démarrage
}

async function verifierClotureAuto(){
  if(!S.vacationId || !S.agent) return;
  const equipe = S.agent.equipe;
  if(!equipe) return;

  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const totalMin = h*60+m;

  // Seuils de clôture automatique
  // Aprem : clôture auto à 01h00 (si pas encore clôturée manuellement)
  // Matin : clôture auto à 08h00 (si pas encore clôturée manuellement)
  let doitClore = false;
  if(equipe === 'Aprem' && totalMin >= 60)  doitClore = true; // dès 01h00
  if(equipe === 'Matin' && totalMin >= 480) doitClore = true; // dès 08h00

  if(!doitClore) return;

  // Clôture automatique silencieuse
  console.log(`[ClôtureAuto] ${equipe} — ${h}h${String(m).padStart(2,'0')} → clôture automatique`);
  try{
    await db.patch('vacations_suivi',`id=eq.${S.vacationId}`,{terminee:true});
    clearInterval(clotureAutoInterval);
    clotureAutoInterval = null;
    arreterRappelColis();
    toast(`⏰ Vacation ${equipe} clôturée automatiquement (${h}h${String(m).padStart(2,'0')})`, 'ok');
    // Réinitialiser l'état local
    S.vacationId = null;
    S.epiValide = false;
    S.controles = [];
    S.colisData = [];
    S.epiData = [];
    S.anomalies = [];
    S.tournees = [];
    S.vue = 'epi';
    render();
  }catch(e){
    console.error('[ClôtureAuto] Erreur:', e);
  }
}

let rappelColisInterval = null;

function programmmerProchainRappel(){
  if(Notification.permission !== 'granted') return;
  const now = new Date();
  const msJusquaProchainHeure = (60 - now.getMinutes()) * 60 * 1000 - now.getSeconds() * 1000;
  
  // Envoyer au Service Worker
  if(navigator.serviceWorker.controller){
    navigator.serviceWorker.controller.postMessage({
      type: 'SCHEDULE_NOTIF',
      delay: msJusquaProchainHeure
    });
  } else {
    // Fallback local si SW pas encore actif
    if(rappelColisInterval) clearInterval(rappelColisInterval);
    setTimeout(()=>{
      envoyerNotif('📦 Rappel relevé colis', 'Pense à saisir le relevé colis !');
      rappelColisInterval = setInterval(()=>{
        envoyerNotif('📦 Rappel relevé colis', 'Pense à saisir le relevé colis !');
      }, 60*60*1000);
    }, msJusquaProchainHeure);
  }
}

function demarrerRappelColis(){
  programmmerProchainRappel();
}

function arreterRappelColis(){
  if(rappelColisInterval){
    clearInterval(rappelColisInterval);
    rappelColisInterval = null;
  }
  // Signaler au SW d'arrêter
  if(navigator.serviceWorker.controller){
    navigator.serviceWorker.controller.postMessage({type: 'STOP_NOTIF'});
  }
}

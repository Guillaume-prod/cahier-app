*{box-sizing:border-box;margin:0;padding:0;}
:root{

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gris);color:var(--texte);min-height:100vh;padding-bottom:80px;}
#app{max-width:480px;margin:0 auto;padding:16px;}

/* LOGIN */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-logo{width:72px;height:72px;background:var(--bleu);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:16px;}
.login-title{font-size:22px;font-weight:800;color:var(--bleu);margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--texte-doux);margin-bottom:24px;}
.login-card{background:white;border-radius:16px;padding:24px;width:100%;max-width:340px;box-shadow:0 4px 20px rgba(0,0,0,0.1);}
.login-error{display:none;color:var(--rouge);font-size:13px;margin-top:8px;text-align:center;}

/* CARDS */
.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.07);}
.card-title{font-size:12px;font-weight:700;color:var(--texte-doux);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px;}

/* FORMS */
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--texte-doux);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em;}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--gris-bord);border-radius:10px;font-size:14px;font-family:inherit;background:white;color:var(--texte);outline:none;transition:border-color 0.2s;}
.form-input:focus{border-color:var(--bleu);}
select.form-input{cursor:pointer;}

/* BUTTONS */
.btn-primary{width:100%;padding:13px;background:var(--bleu);color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:opacity 0.2s;}
.btn-primary:active{opacity:0.85;}
.btn-secondary{width:100%;padding:11px;background:var(--gris);color:var(--texte);border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;}
.btn-ok{padding:8px 16px;background:var(--vert-pale);color:var(--vert);border:2px solid var(--vert);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-nok{padding:8px 16px;background:var(--rouge-pale);color:var(--rouge);border:2px solid var(--rouge);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-add{padding:8px 14px;background:var(--bleu-clair);color:var(--bleu);border:1.5px solid var(--bleu);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;}

/* NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--gris-bord);display:flex;z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 12px;cursor:pointer;font-size:10px;font-weight:600;color:var(--texte-doux);border:none;background:none;}
.nav-item.active{color:var(--bleu);}
.nav-item span{font-size:22px;margin-bottom:2px;}

/* BADGES */
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;}
.badge-ok{background:var(--vert-pale);color:var(--vert);}
.badge-nok{background:var(--rouge-pale);color:var(--rouge);}
.badge-matin{background:#e0f2fe;color:#0369a1;}
.badge-soiree{background:#ede9fe;color:#7c3aed;}

/* STATS */
.stat-box{padding:12px;border-radius:10px;text-align:center;flex:1;}
.stat-box.ok{background:var(--vert-pale);border:1.5px solid var(--vert);}
.stat-box.nok{background:var(--rouge-pale);border:1.5px solid var(--rouge);}
.stat-box.info{background:var(--bleu-clair);border:1.5px solid var(--bleu);}
.stat-val{font-size:22px;font-weight:800;}
.stat-label{font-size:11px;font-weight:600;margin-top:2px;}

/* TABLE */
.table-suivi{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
.table-suivi th{background:var(--bleu);color:white;padding:7px 6px;text-align:center;}
.table-suivi th:first-child{text-align:left;}
.table-suivi td{padding:7px 6px;border-bottom:1px solid var(--gris);text-align:center;}

.info-banner{background:var(--bleu-clair);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--bleu);margin-bottom:12px;}
.empty-state{text-align:center;padding:30px 20px;color:var(--texte-doux);}
.empty-icon{font-size:36px;margin-bottom:8px;}

/* SECTION HEADER */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-title{font-size:16px;font-weight:700;}

/* CONTROLE */

.controle-num{font-size:12px;font-weight:700;color:var(--bleu);margin-bottom:8px;text-transform:uppercase;}
.tournee-row{display:grid;grid-template-columns:24px 1fr 60px;gap:6px;align-items:center;margin-bottom:6px;}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:999;animation:fadeInOut 3s ease forwards;}

.toast.err{background:#dc2626;color:white;}
</style>

async function sbFetch(method, path, body){
  // Jeton de l'utilisateur connecté (renouvelé automatiquement) ; sinon clé publique (avant connexion)
  let token = SUPABASE_KEY;
  try{ const { data } = await supabaseAuth.auth.getSession(); if(data && data.session) token = data.session.access_token; }catch(e){}
  const opts = {method, headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${token}`,'Content-Type':'application/json','Prefer':(path.includes('on_conflict')?'resolution=merge-duplicates,return=representation':'return=representation')}};
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, opts);
  const t = await res.text();
  if(!res.ok) throw new Error(t);
  return t ? JSON.parse(t) : [];
}

function fmtHeure(iso){ if(!iso) return '—'; const d=new Date(iso.endsWith('Z')?iso:iso+'Z'); return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function getToday(){

}

function calcMoyenneSession(sessNum){
  // Moyenne globale pour une session (1er → dernier relevé avec heure + quantité)
  const data = S.colisData.filter(c=>c.quantite_colis&&c.heure_controle&&(c.session_numero||1)===sessNum);
  if(data.length < 2) return null;
  function toMinSess(h){ const [hh,mm]=h.split(':').map(Number); return hh*60+mm; }
  const sorted = [...data].sort((a,b)=>{
    let ma=toMinSess(a.heure_controle), mb=toMinSess(b.heure_controle);
    if(ma<360 && mb>1080) ma+=1440;
    if(mb<360 && ma>1080) mb+=1440;
    return ma-mb;
  });
  const first = sorted[0], last = sorted[sorted.length-1];
  let fMin = toMinSess(first.heure_controle), lMin = toMinSess(last.heure_controle);
  if(lMin < fMin) lMin += 1440; // passage minuit
  let dureeMin = lMin - fMin;
  if(dureeMin<=0) dureeMin+=24*60;
  const totalArret = last.arret_machine_cumul||0;
  const dureeEffective = Math.max(1, dureeMin - totalArret);
  const totalColis = last.quantite_colis - first.quantite_colis;
  if(totalColis<=0) return Math.round((last.quantite_colis/dureeEffective)*60);
  return Math.round((totalColis/dureeEffective)*60);
}

function calcMoyenneColis(){
  // Moyenne globale toutes sessions confondues
  const sessions = [...new Set(S.colisData.map(c=>c.session_numero||1))];
  const moyennes = sessions.map(s=>calcMoyenneSession(s)).filter(m=>m!==null);
  if(!moyennes.length) return null;
  return Math.round(moyennes.reduce((a,b)=>a+b,0)/moyennes.length);
}

// Cadence constatée (colis/h) entre un relevé et le précédent de la même session, arrêts machine déduits : affichée dans les rapports
const _cadMap = new Map();
function chargerCadences(colis){
  const tm = h=>{ const x=h.split(':').map(Number); return x[0]*60+x[1]; };
  [...new Set((colis||[]).map(c=>c.session_numero||1))].forEach(sn=>{
    const rows = colis.filter(c=>c.quantite_colis&&c.heure_controle&&(c.session_numero||1)===sn).sort((a,b)=>{ let ma=tm(a.heure_controle), mb=tm(b.heure_controle); if(ma<360&&mb>1080) ma+=1440; if(mb<360&&ma>1080) mb+=1440; return ma-mb; });
    rows.forEach((c,i)=>{ _cadMap.set(c.id, {v:calcMoyenneLigne(rows,i), arret: i>0?Math.max(0,(c.arret_machine_cumul||0)-(rows[i-1].arret_machine_cumul||0)):0}); });
  });
}
function cadConst(c){
  const x = _cadMap.get(c.id); if(!x||x.v==null) return '—';
  return `<b style="color:${x.v>=OBJECTIF_COLIS?'#16a34a':'#dc2626'}">${fmtN(x.v)}</b>${x.arret?`<div style="font-size:9px;font-weight:normal;color:#6b7280">dont ${x.arret} min d'arrêt</div>`:''}`;
}
function calcMoyenneLigne(sorted, index){
  // Vitesse entre la ligne précédente et la ligne actuelle
  if(index < 1) return null;
  const prev = sorted[index-1];
  const curr = sorted[index];
  if(!prev.quantite_colis || !curr.quantite_colis || !prev.heure_controle || !curr.heure_controle) return null;
  const [ph,pm] = prev.heure_controle.split(':').map(Number);
  const [ch,cm] = curr.heure_controle.split(':').map(Number);
  let dureeMin = (ch*60+cm)-(ph*60+pm);
  if(dureeMin<=0) dureeMin+=24*60;
  if(dureeMin===0) return null;
  const arretPrev = prev.arret_machine_cumul||0;
  const arretCurr = curr.arret_machine_cumul||0;
  const arretTranche = Math.max(0, arretCurr - arretPrev);
  const dureeEffective = Math.max(1, dureeMin - arretTranche);
  const diffColis = curr.quantite_colis - prev.quantite_colis;
  if(diffColis<=0) return null;
  return Math.round((diffColis/dureeEffective)*60);
}

function getMessageDuJour(){
  const today = getToday();
  // Utiliser la date pour choisir un message différent chaque jour
  const seed = today.replace(/-/g,'');
  const idx = parseInt(seed) % MESSAGES_BIENVENUE.length;
  return MESSAGES_BIENVENUE[idx];
}

function doitAfficherBienvenue(){
  try{
    const key = `bienvenue_${S.agent.id}_${getToday()}`;
    return !localStorage.getItem(key);
  }catch(e){ return false; }
}

function marquerBienvenueVue(){
  try{
    const key = `bienvenue_${S.agent.id}_${getToday()}`;
    localStorage.setItem(key, '1');
  }catch(e){}
}

  if(S.vue==='bienvenue'){ app.innerHTML = renderBienvenue(); return; }
  if(S.vue==='choix-bienvenue'){ app.innerHTML = renderChoixBienvenue(); return; }
  if(S.vue==='blague'){ app.innerHTML = renderBlague(); return; }
  if(S.vue==='citation-bienvenue'){
    app.innerHTML = renderCitationBienvenue();
    // Machine à écrire sur la page citation
    const msg2 = getMessageDuJour();
    let j = 0; const texte2 = msg2.citation;
    function tapeCitation(){
      const typed = document.getElementById('bv-typed2');
      const cursor = document.getElementById('bv-cursor2');

      if(!typed) return;
      if(j < texte2.length){ typed.textContent += texte2[j]; j++; setTimeout(tapeCitation, 28 + Math.random()*18); }

        if(cursor) cursor.style.display='none';
        if(auteur){auteur.style.transition='opacity 0.8s';auteur.style.opacity='1';}
        setTimeout(()=>{ if(btnGo) btnGo.style.display='block'; }, 800);
      }
    }
    setTimeout(tapeCitation, 300);
    return;
  }
  
  const nav = S.agent.est_responsable
    ? [['epi','🦺','EPI'],['chantiers','📋','Chantiers'],['colis','📦','Colis/h'],['anomalies','⚠️','Anomalies'],['fiche','📝','Fiche'],['pdf','📄','PDF'],['semaine','📊','Semaine'],['kpi','📈','KPI'],['admin','⚙️','Admin']]

  }
  else if(S.vue==='anomalies') content = renderAnomalies();
  else if(S.vue==='fiche') content = renderFiche();
  else if(S.vue==='kpi') content = renderKPI();
  else if(S.vue==='pdf') content = renderPDF();
  else if(S.vue==='semaine') content = renderSemaine();
  else if(S.vue==='admin') content = renderAdmin();
  
  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-top:8px">

function renderSelectionAgentsChantier(n, c){
  // Agents de l'équipe en cours (pour Aprem/Soirée : fusionner)
  const equipe = S.agent.equipe || S.epiEquipeSelectionnee || '';
  let agents = [];
  if(equipe === 'Soirée' || equipe === 'Aprem'){
    agents = [...(PERSONNEL_DB['Aprem']||[]), ...(PERSONNEL_DB['Soirée']||[])];
  } else if(equipe === 'Matin'){
    agents = PERSONNEL_DB['Matin']||[];
  } else {
    // Admin sans équipe : tous les agents
    agents = Object.values(PERSONNEL_DB).flat();
  }

  // Noms déjà sélectionnés (stockés comme texte séparé par virgules)
  const dejaSelectionnes = (c.noms_chantier||'').split(',').map(s=>s.trim()).filter(Boolean);

  if(!agents.length) return `<input class="form-input" type="text" placeholder="Noms des agents" value="${c.noms_chantier||''}" onchange="sauvegarderControle(${n},'noms_chantier',this.value)" />`;

  return `<div style="background:var(--gris);border-radius:10px;padding:10px;max-height:200px;overflow-y:auto">
    ${agents.map(a=>{
      const nomComplet = `${a.nom} ${a.prenom}`;
      const key = `ch-${n}-${a.id}`;
      const checked = dejaSelectionnes.includes(nomComplet);
      return `<label style="display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;border-bottom:1px solid var(--gris-bord)">
        <input type="checkbox" id="${key}" ${checked?'checked':''} onchange="toggleAgentChantier(${n},this)" style="width:18px;height:18px;accent-color:var(--bleu);cursor:pointer" data-nom="${nomComplet}" />
        <span style="font-size:13px;font-weight:600">${a.nom} ${a.prenom}</span>
      </label>`;
    }).join('')}
  </div>`;
}

async function toggleAgentChantier(numControle, checkbox){
  const nom = checkbox.dataset.nom;
  const c = S.controles.find(x=>x.numero===numControle)||{};
  const dejaSelectionnes = (c.noms_chantier||'').split(',').map(s=>s.trim()).filter(Boolean);
  let nouveaux;
  if(checkbox.checked){
    nouveaux = [...dejaSelectionnes.filter(n=>n!==nom), nom];
  } else {
    nouveaux = dejaSelectionnes.filter(n=>n!==nom);
  }
  const valeur = nouveaux.join(', ');
  await sauvegarderControle(numControle, 'noms_chantier', valeur);
}

// ── COLIS/H ────────────────────────────────────────────────────
function renderColis(){
  const moyGlobale = calcMoyenneColis();
  const moyColor = moyGlobale ? (moyGlobale>=OBJECTIF_COLIS?'var(--vert)':'var(--rouge)') : 'var(--texte-doux)';
  const moyBg = moyGlobale ? (moyGlobale>=OBJECTIF_COLIS?'var(--vert-pale)':'var(--rouge-pale)') : 'var(--bleu-clair)';
  const labelGlobal = moyGlobale ? `${moyGlobale} colis/h` : '—';

  // Sessions existantes (au moins 1 entrée en DB) + session courante
  const sessionsExistantes = [...new Set(S.colisData.map(c=>c.session_numero||1))].sort((a,b)=>a-b);
  const maxSess = sessionsExistantes.length ? Math.max(...sessionsExistantes) : 0;
  const sessionCourante = S.sessionColisActive || maxSess || 1;
  const toutesLessions = sessionsExistantes.includes(sessionCourante) ? sessionsExistantes : [...sessionsExistantes, sessionCourante].sort((a,b)=>a-b);

  function renderSession(sessNum){
    // Lignes affichées = lignes qui contiennent des données + quelques lignes vides à la suite (pas de longue liste de lignes vides)
    const numsData = lignesAvecDonnees(sessNum);
    const dernier = numsData.length ? numsData[numsData.length-1] : 0;
    const nums = numsData.slice();
    for(let k=1;k<=nbVidesColis(sessNum);k++) nums.push(dernier+k);
    const lignes = nums.map(i=>({i, c: S.colisData.find(x=>(x.session_numero||1)===sessNum&&(x.ligne_numero||1)===i)||{}}));
    function toMinRender(h){ const [hh,mm]=h.split(':').map(Number); return hh*60+mm; }
    const sorted = lignes.filter(({c})=>c.quantite_colis&&c.heure_controle).map(({c})=>c).sort((a,b)=>{
      let ma=toMinRender(a.heure_controle), mb=toMinRender(b.heure_controle);
      if(ma<360 && mb>1080) ma+=1440;
      if(mb<360 && ma>1080) mb+=1440;
      return ma-mb;
    });
    const moyS = calcMoyenneSession(sessNum);
    const mSColor = moyS ? (moyS>=OBJECTIF_COLIS?'var(--vert)':'var(--rouge)') : 'var(--texte-doux)';
    const mSBg = moyS ? (moyS>=OBJECTIF_COLIS?'var(--vert-pale)':'var(--rouge-pale)') : 'var(--gris)';

    return `<div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-weight:700;font-size:13px;color:var(--bleu)">📋 Session ${sessNum}</div>
        <div style="font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:${mSBg};color:${mSColor}">${moyS?`${moyS} colis/h`:'En attente'}</div>
      </div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
      <table class="table-suivi" style="min-width:480px;margin-bottom:0">
        <thead><tr>
          <th style="min-width:30px;text-align:center">#</th>
          <th style="position:sticky;left:0;background:white;z-index:2;min-width:50px">Quai</th>
          <th>Camion+H</th><th>H relevé</th><th>Qté colis</th><th>Colis/h</th><th>Arrêt(min)</th>
        </tr></thead>
        <tbody>
          ${lignes.map(({i,c})=>{
            const idx = c.id ? sorted.findIndex(x=>x.id===c.id) : -1;
            const moyL = idx>0 ? calcMoyenneLigne(sorted,idx) : null;
            const mLColor = moyL ? (moyL>=OBJECTIF_COLIS?'var(--vert)':'var(--rouge)') : 'var(--texte-doux)';
            const isAdmin = S.agent && S.agent.est_responsable;
            const heureLocked = !isAdmin && !!c.heure_controle;
            const colisLocked = !isAdmin && !!c.quantite_colis;
            const lockedStyle = 'background:var(--gris);color:var(--texte);border-color:transparent;cursor:not-allowed';
            return `<tr style="${c.quantite_colis&&c.quantite_colis<OBJECTIF_COLIS?'background:var(--rouge-pale)':''}">
              <td style="text-align:center;font-size:11px;color:var(--texte-doux);font-weight:700">${i}</td>
              <td style="position:sticky;left:0;background:${c.quantite_colis&&c.quantite_colis<OBJECTIF_COLIS?'#fee2e2':'white'};z-index:1">
                <input style="width:48px;border:1.5px solid var(--gris-bord);border-radius:6px;font-size:12px;font-weight:700;text-align:center;padding:4px 2px" type="text" placeholder="Q?" value="${c.quai||''}" onblur="sauvegarderColisLigne(${sessNum},${i},'quai',this.value)" />
              </td>
              <td><input style="width:76px;border:none;background:transparent;font-size:11px;text-align:center" type="text" placeholder="—" value="${c.camion_h_debut||''}" onblur="sauvegarderColisLigne(${sessNum},${i},'camion_h_debut',this.value)" /></td>
              <td>${heureLocked
                ? `<span style="display:inline-block;width:72px;text-align:center;font-size:12px;font-weight:700;color:var(--texte);background:var(--gris);border-radius:6px;padding:5px 4px;border:1.5px solid transparent">🔒 ${c.heure_controle}</span>`
                : `<input style="width:72px;border:1.5px solid var(--gris-bord);border-radius:6px;font-size:11px;text-align:center;padding:4px" type="time" value="${c.heure_controle||''}" onchange="sauvegarderColisLigne(${sessNum},${i},'heure_controle',this.value)" />`
              }</td>

function ajouterSessionColis(){
  const sessions = [...new Set(S.colisData.map(c=>c.session_numero||1))];
  const max = sessions.length ? Math.max(...sessions) : 0;
  S.sessionColisActive = max + 1;
  render();
}

function lignesAvecDonnees(sessNum){
  const nums = S.colisData.filter(x=>(x.session_numero||1)===sessNum && (x.quantite_colis||x.heure_controle||x.quai||x.camion_h_debut||x.arret_machine_cumul||x.raison_non_atteinte)).map(x=>x.ligne_numero||1);
  return [...new Set(nums)].sort((a,b)=>a-b);
}
// Nombre de lignes vides affichées en fin de session : 5 si la session est vide, sinon 2 (le bouton ＋ Ligne en ajoute)
function nbVidesColis(sessNum){
  const base = lignesAvecDonnees(sessNum).length ? 2 : 5;
  return Math.max(base, (S.lignesSession&&S.lignesSession[sessNum])||0);
}
function ajouterLigneColis(sessNum){
  if(!S.lignesSession) S.lignesSession = {};
  S.lignesSession[sessNum] = nbVidesColis(sessNum) + 1;
  render();
}

function calcMoyenneColisArchive(colisData){
  const sessions = [...new Set(colisData.map(c=>c.session_numero||1))];
  const moyennes = sessions.map(sessNum=>{
    const data = colisData.filter(c=>c.quantite_colis&&c.heure_controle&&(c.session_numero||1)===sessNum);
    if(data.length<1) return null;
    function toMinArch(h){ const [hh,mm]=h.split(':').map(Number); return hh*60+mm; }
    const sorted = [...data].sort((a,b)=>{
      let ma=toMinArch(a.heure_controle), mb=toMinArch(b.heure_controle);
      if(ma<360 && mb>1080) ma+=1440;
      if(mb<360 && ma>1080) mb+=1440;
      return ma-mb;
    });
    const first = sorted[0], last = sorted[sorted.length-1];
    let fMinA=toMinArch(first.heure_controle), lMinA=toMinArch(last.heure_controle);
    if(lMinA<fMinA) lMinA+=1440;
    let duree = lMinA - fMinA;
    if(duree<=0) duree+=24*60;
    const arret = last.arret_machine_cumul||0;
    const dureeEff = Math.max(1,duree-arret);
    const totalColis = last.quantite_colis - (data.length>1?first.quantite_colis:0);
    if(totalColis<=0) return Math.round((last.quantite_colis/dureeEff)*60);
    return Math.round((totalColis/dureeEff)*60);
  }).filter(m=>m!==null);
  if(!moyennes.length) return null;
  return Math.round(moyennes.reduce((a,b)=>a+b,0)/moyennes.length);
}

function exporterPDFArchive(index){

async function connexion(){
  const prenom = document.getElementById('login-prenom')?.value.trim();
  const mdp = document.getElementById('login-code')?.value.trim();
  if(!prenom||!mdp){ document.getElementById('login-error').style.display='block'; return; }
  try{
    // Trouver l'email correspondant au prénom dans la table agents
    // Avant connexion, seule la fonction email_pour_prenom est accessible (la table agents est protégée)
    const emailTrouve = await sbFetch('POST','rpc/email_pour_prenom',{p_prenom:prenom});
    if(!emailTrouve){ document.getElementById('login-error').style.display='block'; return; }
    // Connexion via Supabase Auth
    const { data, error } = await supabaseAuth.auth.signInWithPassword({
      email: emailTrouve,
      password: mdp
    });
    if(error){ document.getElementById('login-error').style.display='block'; return; }
    // Une fois connecté, on lit la fiche de l'agent normalement
    const agentRes = await db.get('agents',`email=eq.${encodeURIComponent(emailTrouve)}&select=*`);
    if(!agentRes.length){ document.getElementById('login-error').style.display='block'; return; }
    const agentData = agentRes[0];
    S.agent = agentData;
    S.authSession = data.session;
    S.loading = true; render();
    await chargerTout();
    S.loading = false;
    // Afficher la page de bienvenue à la première connexion du jour
    if(doitAfficherBienvenue()){
      S.vue = 'bienvenue';
    }
    render();
    await demanderPermissionNotif();
    await inscrirePush();
    demarrerRappelColis();
    demarrerClotureAuto();
  }catch(e){ toast('Erreur connexion','err'); console.error(e); }
}

// ── FENÊTRES DE SAISIE ─────────────────────────────────────────
// Aprem : de 16h00 à 01h00 ; Matin : de 00h00 à 09h00 ; autres équipes et responsable : toujours ouvert
function minutesNow(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }
function fenetreSaisieOuverte(equipe){
  const t = minutesNow();
  if(equipe==='Aprem') return t>=960 || t<60;
  if(equipe==='Matin') return t<540;
  return true;
}
function libelleFenetre(equipe){ return equipe==='Aprem' ? '16h00 à 01h00' : equipe==='Matin' ? '00h00 à 09h00' : ''; }
function renderFermee(){
  const eq = S.agent.equipe;
  return `<div class="card" style="text-align:center">

    <div class="card-title" style="justify-content:center">Saisie fermée</div>
    <div class="info-banner">La saisie de l'équipe ${eq} est ouverte de <strong>${libelleFenetre(eq)}</strong>.<br>Revenez dans ce créneau : l'application s'ouvrira toute seule.</div>
    <button class="btn-primary" onclick="actualiserFenetre()">🔄 Actualiser</button>
  </div>`;
}
async function actualiserFenetre(){
  S.loading = true; render();
  try{ await chargerTout(); }catch(e){ console.error(e); }
  S.loading = false; render();

async function getOrCreateVacation(){
  const equipe = S.agent.equipe || 'Toutes';
  // Chercher sur les 2 derniers jours pour gérer le passage minuit (équipe d'aprem)
  const hier = new Date(Date.now() - 36*60*60*1000);
  const hierStr = `${hier.getFullYear()}-${String(hier.getMonth()+1).padStart(2,'0')}-${String(hier.getDate()).padStart(2,'0')}`;
  let vacs = await db.get('vacations_suivi',`agent_id=eq.${S.agent.id}&date=gte.${hierStr}&order=created_at.desc&select=*`);
  S.horsFenetre = false;
  // Hors du créneau de saisie : on ferme une vacation oubliée et on n'en crée pas de nouvelle
  if(!S.agent.est_responsable && !fenetreSaisieOuverte(equipe)){
    const oubliee = vacs.find(v=>!v.terminee);
    if(oubliee){ try{ await db.patch('vacations_suivi',`id=eq.${oubliee.id}`,{terminee:true}); }catch(e){} }
    S.vacationId = null; S.horsFenetre = true;
    return;
  }
  // Prendre la vacation active la plus récente (non terminée) ; une vacation ouverte depuis plus de 14 h est périmée
  let vacActive = vacs.find(v=>!v.terminee);
  if(vacActive && vacActive.created_at && (Date.now() - new Date(vacActive.created_at.endsWith('Z')?vacActive.created_at:vacActive.created_at+'Z').getTime()) > 14*3600*1000){
    try{ await db.patch('vacations_suivi',`id=eq.${vacActive.id}`,{terminee:true}); }catch(e){}
    vacActive = null;
  }
  if(!vacActive){
    const created = await db.post('vacations_suivi',{agent_id:S.agent.id, equipe, date:S.date});
    S.vacationId = created[0].id;
    // S.date reste aujourd'hui
  } else {
    S.vacationId = vacActive.id;
    // Utiliser la date de la vacation trouvée (important après minuit)
    S.date = vacActive.date;
  }
}

// ── SAUVEGARDE COLIS ────────────────────────────────────────────
async function sauvegarderColisLigne(sessNum, ligneNum, champ, valeur){
  try{
    if(!S.vacationId){ toast('Session non initialisée','err'); return; }
    let c = S.colisData.find(x=>(x.session_numero||1)===sessNum&&(x.ligne_numero||1)===ligneNum);
    const now = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    const autoHeure = (champ==='quantite_colis' && valeur && (!c||!c.heure_controle)) ? now : null;
    // Calcul cadence basé sur la vitesse inter-lignes (colis/h) et non la quantité brute
    let autoCadence = null;
    if(champ==='quantite_colis' && valeur!=null){
      // Chercher la ligne précédente dans la même session pour calculer la cadence réelle
      const sessNum2 = c ? (c.session_numero||1) : sessNum;
      const ligneNum2 = c ? (c.ligne_numero||1) : ligneNum;
      const lignesPrecedentes = S.colisData.filter(x=>
        (x.session_numero||1)===sessNum2 &&
        (x.ligne_numero||1) < ligneNum2 &&
        x.quantite_colis && x.heure_controle
      ).sort((a,b)=>(a.ligne_numero||1)-(b.ligne_numero||1));
      const prev = lignesPrecedentes[lignesPrecedentes.length-1];
      if(prev && prev.heure_controle){
        const heureActuelle = autoHeure || (c&&c.heure_controle) || now;
        const [ph,pm] = prev.heure_controle.split(':').map(Number);
        const [ch2,cm2] = heureActuelle.split(':').map(Number);
        let dureeMin = (ch2*60+cm2)-(ph*60+pm);
        if(dureeMin<=0) dureeMin+=24*60;
        if(dureeMin>0){
          const diffColis = valeur - prev.quantite_colis;
          if(diffColis>0){
            const cadenceCalc = Math.round((diffColis/dureeMin)*60);
            autoCadence = cadenceCalc >= OBJECTIF_COLIS;
          } else {
            autoCadence = false;
          }
        }
      } else {
        // Première ligne de la session : pas de précédent, on ne peut pas juger
        autoCadence = null;
      }
    }

    if(!c){
      const body = {vacation_id:S.vacationId, session_numero:sessNum, ligne_numero:ligneNum, tranche:`S${sessNum}-L${ligneNum}`, [champ]:valeur};
      if(autoHeure) body.heure_controle = autoHeure;
      if(autoCadence!==null) body.cadence_ok = autoCadence;
      const created = await db.post('controles_colis', body);
      if(created && created[0]) S.colisData.push(created[0]);
    } else {
      const body = {[champ]:valeur};
      if(autoHeure) body.heure_controle = autoHeure;
      if(autoCadence!==null) body.cadence_ok = autoCadence;
      await db.patch('controles_colis',`id=eq.${c.id}`, body);
      c[champ] = valeur;
      if(autoHeure) c.heure_controle = autoHeure;
      if(autoCadence!==null) c.cadence_ok = autoCadence;
    }
    // Re-render pour mettre à jour moyennes (seulement après blur, pas pendant saisie)
    if(champ !== 'quai' && champ !== 'camion_h_debut' && champ !== 'raison_non_atteinte') render();
  }catch(e){ toast('Erreur: '+e.message,'err'); console.error('sauvegarderColisLigne',e); }
}

  { code:'PU',   label:'P.U — Pick-Up',                    couleur:'#d97706', bg:'#fef3c7' },

  { code:'MEP',  label:'Mise en Place',                    couleur:'#059669', bg:'#d1fae5' },
  { code:'FACTEO',label:'Facteo (IMEI)',                  couleur:'#0891b2', bg:'#cffafe' },
  { code:'AUTRE',label:'Autre',                            couleur:'#1a56a0', bg:'#e8f0fb' },

async function ajouterAnomalie(){
  try{
    const created = await db.post('anomalies',{vacation_id:S.vacationId, type_anomalie:'ERA', description:'', photo_base64:null});
    if(!S.anomalies) S.anomalies = [];
    S.anomalies.push(created[0]);
    render();
  }catch(e){ toast('Erreur création anomalie','err'); }
}

async function supprimerAnomalie(id){
  if(!confirm('Supprimer cette anomalie ?')) return;
  try{
    await db.del('anomalies',`id=eq.${id}`);
    S.anomalies = S.anomalies.filter(a=>a.id!==id);
    render();
  }catch(e){ toast('Erreur suppression','err'); }
}

async function modifierAnomalie(id, champ, valeur){
  try{
    await db.patch('anomalies',`id=eq.${id}`,{[champ]:valeur});
    const a = S.anomalies.find(x=>x.id===id);
    if(a){ a[champ]=valeur; if(champ==='type_anomalie') render(); }
  }catch(e){ toast('Erreur sauvegarde','err'); }
}

function ajouterPhotoAnomalie(id, input){
  const file = input.files[0];
  if(!file) return;
  // Redimensionner avant encodage pour limiter la taille
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const MAX = 1000;
      let w = img.width, h = img.height;
      if(w > MAX){ h = Math.round(h*MAX/w); w = MAX; }
      if(h > MAX){ w = Math.round(w*MAX/h); h = MAX; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const base64 = canvas.toDataURL('image/jpeg', 0.78);
      const a = S.anomalies.find(x=>x.id===id);
      if(!a) return;
      const champ = CHAMPS_PHOTO.find(ch=>!a[ch]);
      if(!champ){ toast('3 photos maximum','err'); return; }
      a[champ] = base64; render();
      modifierAnomalie(id, champ, base64);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function supprimerPhotoAnomalie(id, champ){
  champ = champ || 'photo_base64';
  try{
    await db.patch('anomalies',`id=eq.${id}`,{[champ]:null});
    const a = S.anomalies.find(x=>x.id===id);
    if(a){ a[champ]=null; render(); }
  }catch(e){ toast('Erreur suppression photo','err'); }
}

// ── PARTAGE PDF + RÉCAP SEMAINE ────────────────────────────────
function escHtml(t){ return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nomFichierPDF(){
  const eq = (S.agent && S.agent.equipe) ? S.agent.equipe : 'Cahier';
  return `Cahier_${eq}_${(S.date||'').replace(/[^0-9-]/g,'')||'jour'}.pdf`;
}
async function partagerPDF(nom){
  const el = document.getElementById('pdf-content');
  if(!el) return;
  nom = (typeof nom==='string' && nom) ? nom : (window._nomPdfPartage || nomFichierPDF());
  if(typeof html2pdf==='undefined'){ toast('Module PDF non chargé (vérifiez la connexion)','err'); return; }
  toast('Préparation du PDF…','ok');
  try{
    const blob = await html2pdf().set({
      margin:8, filename:nom, image:{type:'jpeg',quality:0.85},
      html2canvas:{scale:1.5,useCORS:true}, jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['css','legacy']}
    }).from(el).outputPdf('blob');
    const file = new File([blob], nom, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:nom.replace('.pdf',''), text: window._texteResume || ('La Poste Mulhouse — '+nom.replace('.pdf','').replace(/_/g,' '))});
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nom;
      document.body.appendChild(a); a.click(); a.remove();
      toast('PDF téléchargé','ok');
    }
  }catch(e){
    if(e && e.name==='AbortError') return;
    toast('Erreur lors de la création du PDF','err'); console.error(e);
  }
}
async function copierResume(){
  try{ await navigator.clipboard.writeText(window._texteResume||''); toast('Résumé copié : collez-le dans le mail','ok'); }
  catch(e){ toast('Copie impossible','err'); }
}
function lundiDe(d){ const x=new Date(d); const j=(x.getDay()+6)%7; x.setDate(x.getDate()-j); return x; }
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function renderSemaine(){

async function genererRecapSemaine(){
  const val = document.getElementById('sem-lundi')?.value;
  if(!val) return toast('Choisissez une date','err');
  const lun = lundiDe(new Date(val)); const dim = new Date(lun); dim.setDate(dim.getDate()+6);
  const from = isoLocal(lun), to = isoLocal(dim);
  toast('Chargement de la semaine…','ok');
  try{
    // Aprem : du samedi précédent au vendredi (l'Aprem du samedi suivant appartient à la semaine suivante) ; Matin et autres : du lundi au dimanche
    let vacs = await db.get('vacations_suivi',`date=gte.${addJours(from,-2)}&date=lte.${to}&select=*&order=date.asc`);
    vacs = vacs.filter(v=> typeEquipe(v.equipe)==='aprem' ? (v.date>=addJours(from,-2) && v.date<=addJours(from,4)) : (v.date>=from && v.date<=to));
    if(!vacs.length){ toast('Aucune vacation cette semaine','err'); return; }
    const ids = vacs.map(v=>v.id).join(',');
    let [colis, epi, anos, ctrl, agents] = await Promise.all([
      db.get('controles_colis',`vacation_id=in.(${ids})&order=created_at.asc`),
      db.get('epi',`vacation_id=in.(${ids})&order=created_at.asc`),
      db.get('anomalies',`vacation_id=in.(${ids})&order=created_at.asc`),
      db.get('controles_chantiers',`vacation_id=in.(${ids})&select=id,vacation_id`),
      db.get('agents',`id=in.(${[...new Set(vacs.map(v=>v.agent_id))].join(',')})&select=id,prenom,nom`)
    ]);
    let fiches = [];
    try{ fiches = await db.get('fiches_vacation',`vacation_id=in.(${ids})`); }catch(e){ fiches = []; }
    // On ignore les vacations vides (créées à chaque connexion) et on ne garde qu'une vacation par jour et par équipe (la plus remplie)
    { const ficheTxt = v=>{ const r = fiches.find(x=>String(x.vacation_id)===String(v.id)); if(!r) return 0; const f = normFiche(r); return f.volumes.length + (aVal(f.presents)?1:0) + f.conc.liaisons.length + (f.fin_tri?1:0); };
      const score = v => colis.filter(c=>c.vacation_id===v.id&&c.quantite_colis).length + epi.filter(e=>e.vacation_id===v.id&&e.nom_prenom&&e.nom_prenom!=='RAS').length
        + anos.filter(a=>a.vacation_id===v.id).length + ctrl.filter(c=>c.vacation_id===v.id).length + ficheTxt(v);
      const best = {}; vacs.forEach(v=>{ const k = v.date+'|'+equipeKpi(v.equipe), n = score(v); if(n>0 && (!best[k] || n>best[k].n)) best[k] = {v,n}; });
      vacs = Object.values(best).map(x=>x.v).sort((a,b)=>a.date<b.date?-1:(a.date>b.date?1:0));
      const _ids = new Set(vacs.map(v=>String(v.id))); const gardee = x=>_ids.has(String(x.vacation_id));
      colis = colis.filter(gardee); epi = epi.filter(gardee); anos = anos.filter(gardee); ctrl = ctrl.filter(gardee);
      if(!vacs.length){ toast('Aucune saisie cette semaine','err'); return; } }
    const volJ = vacs.map(v=>{ const r = fiches.find(x=>String(x.vacation_id)===String(v.id)); const f = r?normFiche(r):null; const c = calcFiche(f);
      return {v, f, c, aprem:/^(Aprem|Soir)/i.test(v.equipe||'')}; }).filter(x=>x.f && (x.c.lignes.length || aVal(x.f.presents) || x.c.totConc || x.f.fin_tri));
    const wk = volJ.reduce((a,x)=>{ a.disp+=x.c.sumDisp; a.dist+=x.c.sumDist; a.hn+=x.c.hn; a.total+=x.c.totalHN; a.conc+=x.c.totConc; return a; },{disp:0,dist:0,hn:0,total:0,conc:0});
    const parVac = vacs.map(v=>{
      const c = colis.filter(x=>x.vacation_id===v.id);
      const moy = c.length ? calcMoyenneColisArchive(c) : null;
      const ag = agents.find(a=>a.id===v.agent_id);
      return {v, moy, ag: ag?ag.prenom+' '+ag.nom:'—',
              nbAno: anos.filter(x=>x.vacation_id===v.id).length,
              nbEpi: epi.filter(x=>x.vacation_id===v.id && x.nom_prenom!=='RAS').length,
              nbCtrl: ctrl.filter(x=>x.vacation_id===v.id).length};
    });
    const moyennes = parVac.map(x=>x.moy).filter(m=>m!=null && !isNaN(m));
    const moyGlobale = moyennes.length ? Math.round(moyennes.reduce((a,b)=>a+b,0)/moyennes.length) : null;
    const parType = TYPES_ANOMALIE.map(t=>({t, n: anos.filter(a=>a.type_anomalie===t.code).length}));
    const epiManq = epi.filter(x=>x.nom_prenom!=='RAS');
    const fmtJ = d=>new Date(d).toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'});
    const th = 'padding:6px;text-align:left';
    const contenu = `
    <div style="font-family:Arial,sans-serif;padding:20px;max-width:800px;margin:0 auto;font-size:12px">
      <h1 style="color:#1a56a0;border-bottom:3px solid #1a56a0;padding-bottom:8px;font-size:18px">📊 Récapitulatif de la semaine — La Poste Mulhouse</h1>
      <p><strong>Semaine du</strong> ${fmtJ(from)} <strong>au</strong> ${fmtJ(to)} | <strong>Établi par :</strong> ${escHtml(S.agent.prenom+' '+S.agent.nom)}</p>
      <table style="width:100%;border-collapse:collapse;margin:12px 0"><tr>
        <td style="padding:10px;background:#f4f6f9;border-radius:6px;text-align:center"><div style="font-size:20px;font-weight:bold">${vacs.length}</div>vacations</td>
        <td style="padding:10px;background:${moyGlobale&&moyGlobale>=OBJECTIF_COLIS?'#dcfce7':'#fee2e2'};text-align:center"><div style="font-size:20px;font-weight:bold">${moyGlobale||'—'}</div>colis/h moyen (objectif ${OBJECTIF_COLIS})</td>
        <td style="padding:10px;background:#fef3c7;text-align:center"><div style="font-size:20px;font-weight:bold">${anos.length}</div>anomalies</td>
        <td style="padding:10px;background:#f4f6f9;text-align:center"><div style="font-size:20px;font-weight:bold">${epiManq.length}</div>manquement(s) EPI</td>
      </tr></table>


      <h2 style="color:#1a56a0;font-size:14px;margin:16px 0 8px;border-left:4px solid #1a56a0;padding-left:8px">📦 Volumes de la semaine</h2>

// ── RAPPORT DE NUIT CONSOLIDÉ ────────────────────────────────────
// Jours de la « nuit » : l'Aprem du jour J est associé au Matin du lendemain ; l'Aprem du samedi est associé au Matin du lundi
function jourSemaine(iso){ return new Date(iso+'T12:00:00').getDay(); }
function matinDe(dateAprem){ return addJours(dateAprem, jourSemaine(dateAprem)===6 ? 2 : 1); }
function apremDe(dateMatin){ return addJours(dateMatin, jourSemaine(dateMatin)===1 ? -2 : -1); }
// Semaine « métier » : l'Aprem du samedi/dimanche compte dans la semaine suivante (avec le Matin du lundi)
function lundiMetier(iso, eq){ const l = lundiIso(iso), j = jourSemaine(iso); return (typeEquipe(eq)==='aprem' && (j===6||j===0)) ? addJours(l,7) : l; }

function confirmerRapportNuit(){
  const input = document.getElementById('date-rapport-nuit');
  const dateAprem = input ? input.value : S.date;
  if(!dateAprem){ toast('Sélectionne une date','err'); return; }

  // Calculer J+1 pour le Matin
  const dateMatin = matinDe(dateAprem);

  // Confirmation
  const ok = confirm(`Générer le rapport de nuit ?\n\n🌆 Aprem du ${fmtDate(dateAprem)}\n☀️ Matin du ${fmtDate(dateMatin)}\n\nCela va charger les données depuis la base.`);
  if(ok) exporterRapportNuit(dateAprem, dateMatin);
}

async function exporterRapportNuit(dateAprem, dateMatin){
  toast('⏳ Chargement des données…','info');

  try{
    // Charger vacation Aprem de J (terminée ou non)
    const vacsAprem = await db.get('vacations_suivi',`date=eq.${dateAprem}&equipe=in.(Aprem,Soir%C3%A9e)&select=*&order=created_at.desc`);
    // Charger vacation Matin de J+1 (terminée ou non)
    const vacsMatin = await db.get('vacations_suivi',`date=eq.${dateMatin}&equipe=in.(Matin,Nuit)&select=*&order=created_at.desc`);

    // Charger les détails de chaque vacation
    async function chargerDetails(vacs){
      if(!vacs.length) return null;
      // Plusieurs vacations le même jour (ex. une vacation vide créée à la reconnexion) : on garde celle qui contient le plus de saisies
      let meilleur = null;
      for(const v of vacs){
        const agent = (S.tousAgents||[]).find(a=>a.id===v.agent_id)||{prenom:'?',nom:'',equipe:v.equipe||''};
        const controles = await db.get('controles_chantiers',`vacation_id=eq.${v.id}&order=numero.asc`);
        const colis = await db.get('controles_colis',`vacation_id=eq.${v.id}&order=created_at.asc`);
        const epi = await db.get('epi',`vacation_id=eq.${v.id}&order=created_at.asc`);
        const anomalies = await db.get('anomalies',`vacation_id=eq.${v.id}&order=created_at.asc`);
        const ids = controles.map(c=>c.id);
        const tournees = ids.length ? await db.get('tournees',`controle_id=in.(${ids.join(',')})&order=numero.asc`) : [];
        const fiche = await chargerFicheDe(v.id);
        const score = controles.length + colis.filter(c=>c.quantite_colis).length + epi.length + anomalies.length + (fiche?fiche.volumes.length+(aVal(fiche.presents)?1:0):0);
        if(!meilleur || score > meilleur.score) meilleur = {score, vacation:v, agent, controles, colis, epi, anomalies, tournees, fiche};
      }
      const {score, ...detail} = meilleur;
      return detail;
    }

    const detailAprem = await chargerDetails(vacsAprem);
    const detailMatin = await chargerDetails(vacsMatin);

    if(!detailAprem && !detailMatin){
      toast('Aucune vacation trouvée pour ces dates','err');
      return;
    }

    // Générer le HTML de chaque section
    function htmlVacation(d, label, emoji, dateStr){
      if(!d) return `<div style="page-break-before:always;padding:20px;font-family:Arial,sans-serif;font-size:12px">
        <h2 style="color:#6b7280">${emoji} ${label} — ${dateStr}</h2>
        <p style="color:#9ca3af;margin-top:12px">Aucune donnée saisie pour cette vacation.</p>
      </div>`;

      chargerCadences(d.colis);
      function toMinN(h){ const [hh,mm]=h.split(':').map(Number); return hh*60+mm; }
      // Calcul moyenne colis
      const sessions = [...new Set(d.colis.map(c=>c.session_numero||1))];
      const moyennes = sessions.map(sessNum=>{

// ══════════════════════════════════════════════════════════════
// FICHE DE VACATION (effectif, volumes, concentration) + SYNTHÈSE
// ══════════════════════════════════════════════════════════════
const PREVUS_DEFAUT = {aprem:20, matin:20, conc:8};
function typeEquipe(eq){ return /Aprem|Soir/i.test(eq||'')?'aprem':(/Matin|Nuit/i.test(eq||'')?'matin':null); }
function ficheVide(){ return {absents:[], presents:'', prevus:'', interim:'', fin_tri:'', cible_tri:'', hn:'', volumes:[], conc:{presents:'', prevus:'', interim:'', liaisons:[]}, commentaire:'', passation:''}; }
function nI(v){ const n=parseInt(v,10); return isNaN(n)?0:n; }
function aVal(v){ return v!==''&&v!=null&&!isNaN(parseInt(v,10)); }
function normFiche(r){
  const f = ficheVide(); if(!r) return f;
  f.presents = r.presents==null?'':r.presents; f.hn = r.hn==null?'':r.hn;
  f.prevus = r.prevus==null?'':r.prevus; f.interim = r.interimaires==null?'':r.interimaires;
  f.fin_tri = r.fin_tri||''; f.cible_tri = r.cible_tri||'';
  f.absents = Array.isArray(r.absents)?r.absents:[];
  f.volumes = Array.isArray(r.volumes)?r.volumes:[];
  f.conc = (r.conc && typeof r.conc==='object') ? Object.assign({presents:'',prevus:'',interim:'',liaisons:[]}, r.conc) : {presents:'',prevus:'',interim:'',liaisons:[]};
  if(!Array.isArray(f.conc.liaisons)) f.conc.liaisons=[];
  f.commentaire = r.commentaire||''; f.passation = r.passation||'';
  return f;
}
function prevusEff(f, eq, conc){
  const v = conc ? (f&&f.conc&&f.conc.prevus) : (f&&f.prevus);
  if(aVal(v)) return nI(v);
  if(conc) return PREVUS_DEFAUT.conc;
  const t = typeEquipe(eq); return t?PREVUS_DEFAUT[t]:null;
}
// Absents = noms saisis (interne) sinon déduit des présents.
function effAbs(f, prevus, presents){
  const vac = 0;
  const base = prevus==null?null:prevus;
  const noms = f&&Array.isArray(f.absents)?f.absents.filter(a=>a&&a.nom&&a.nom.trim()).length:0;
  const absN = base==null||!aVal(presents)?null:(noms>0?noms:Math.max(0, base-nI(presents)));
  return {vac, base, absN, noms};
}
function kpiEff(presents, prevus, interim, f){
  if(!aVal(presents)||prevus==null) return null;
  const p = nI(presents); const e = effAbs(f, prevus, presents);
  return {presents:p, prevus, interim:aVal(interim)?nI(interim):null, ecart:p-prevus, vac:e.vac, abs: e.base>0?Math.round(e.absN/e.base*1000)/10:0, absN:e.absN};
}
function txtEff(k){
  if(!k) return '—';
  return `${k.presents} présents / ${k.prevus} prévus — écart ${k.ecart>0?'+':''}${k.ecart} — absentéisme ${String(k.abs).replace('.',',')} %${k.absN?' ('+k.absN+' absent'+(k.absN>1?'s':'')+')':''}${k.interim!=null?' — dont '+k.interim+' intérimaire(s)':''}`;
}
function minHeure(h){ if(!h) return null; const x=h.split(':').map(Number); return x[0]*60+x[1]; }
function ecartTri(fin, cible){
  const a=minHeure(fin), b=minHeure(cible); if(a==null||b==null) return null;
  let d=a-b; if(d>720) d-=1440; if(d<-720) d+=1440; return d;
}
function txtTri(f){
  if(!f||!f.fin_tri) return f&&f.cible_tri ? 'Fin de tri non renseignée (cible '+f.cible_tri+')' : '—';
  const d = ecartTri(f.fin_tri, f.cible_tri);
  if(d==null) return 'Fin de tri à '+f.fin_tri;
  return `Fin de tri à ${f.fin_tri} (cible ${f.cible_tri}) — ${d<=0?'✅ dans les temps'+(d<0?' ('+(-d)+' min d\'avance)':''):'⏱ retard de '+d+' min'}`;
}
function calcFiche(f){
  f = f || ficheVide();
  const lignes = (f.volumes||[]).map(l=>({...l, distrib: aVal(l.total) ? nI(l.total)-nI(l.disp) : null}));
  const sumTot = lignes.reduce((a,l)=>a+nI(l.total),0);
  const sumDisp = lignes.reduce((a,l)=>a+(aVal(l.total)?nI(l.disp):0),0);
  const sumDist = lignes.reduce((a,l)=>a+(l.distrib||0),0);
  const hn = nI(f.hn);
  const liaisons = ((f.conc||{}).liaisons||[]).map(li=>({...li, somme:(li.camions||[]).reduce((a,c)=>a+nI(c.colis),0)}));
  const totConc = liaisons.reduce((a,l)=>a+l.somme,0);
  return {lignes, sumTot, sumDisp, sumDist, hn, totalHN:sumTot+hn, liaisons, totConc};
}
// Totaux de la nuit : { aprem, matin } = résultats de calcFiche (ou null)
function totauxNuit(fa, fm){
  const a = calcFiche(fa), m = calcFiche(fm);
  const sans = {disp:a.sumDisp+m.sumDisp, dist:a.sumDist+m.sumDist, hn:a.hn+m.hn, total:a.totalHN+m.totalHN};
  return {a, m, sans, conc:a.totConc, avec: sans.total + a.totConc};
}
async function chargerFiche(){
  S.ficheIndispo = false; chargerNomsAbsents().then(()=>{ if(S.fiche) render(); });
  if(!S.vacationId){ S.fiche = null; return; }
  try{
    const r = await db.get('fiches_vacation',`vacation_id=eq.${S.vacationId}`);
    S.fiche = normFiche(r[0]);
    const t = typeEquipe(S.agent&&S.agent.equipe);
    if(!aVal(S.fiche.prevus) && t) S.fiche.prevus = PREVUS_DEFAUT[t];
    if(!aVal(S.fiche.conc.prevus)) S.fiche.conc.prevus = PREVUS_DEFAUT.conc;
  }catch(e){ console.warn('fiches_vacation indisponible', e); S.fiche = ficheVide(); S.ficheIndispo = true; }
}
async function chargerFicheDe(vacId){
  try{ const r = await db.get('fiches_vacation',`vacation_id=eq.${vacId}`); return r[0]?normFiche(r[0]):null; }catch(e){ return null; }
}
let _ficheTimer = null;
function planifierSaveFiche(){ clearTimeout(_ficheTimer); _ficheTimer = setTimeout(sauverFiche, 700); }
async function sauverFiche(){
  clearTimeout(_ficheTimer); _ficheTimer = null;
  if(!S.vacationId || !S.fiche || S.ficheIndispo) return;
  const f = S.fiche;
  try{
    await db.post('fiches_vacation?on_conflict=vacation_id', {
      vacation_id:String(S.vacationId), presents: aVal(f.presents)?nI(f.presents):null, prevus: aVal(f.prevus)?nI(f.prevus):null, interimaires: aVal(f.interim)?nI(f.interim):null, fin_tri:f.fin_tri||null, cible_tri:f.cible_tri||null, hn: aVal(f.hn)?nI(f.hn):null, absents:f.absents||[],
      volumes:f.volumes, conc:f.conc, commentaire:f.commentaire||'', passation:f.passation||'', updated_at:new Date().toISOString()
    });
    const el = document.getElementById('fiche-statut'); if(el) el.textContent = '✅ Enregistré';
    planifierSyncKPI();
  }catch(e){ const el = document.getElementById('fiche-statut'); if(el) el.textContent = '❌ Erreur d\'enregistrement'; console.error(e); }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && _ficheTimer) sauverFiche(); });

function fSet(path, val){
  if(!S.fiche) S.fiche = ficheVide();
  const p = path.split('.'); let o = S.fiche;
  for(let i=0;i<p.length-1;i++) o = o[p[i]];
  o[p[p.length-1]] = val;
  const el = document.getElementById('fiche-statut'); if(el) el.textContent = '… enregistrement';
  rafraichirFiche(); planifierSaveFiche();
}
function fStruct(fn){ if(!S.fiche) S.fiche = ficheVide(); fn(S.fiche); render(); planifierSaveFiche(); }

// ── Absents (interne : jamais dans les rapports) ──
const MOTIFS_ABS = ['Maladie','Congé','Absence non justifiée','Accident du travail','Formation','Autre'];
function normNom(n){ return String(n||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(' ').sort().join(' '); }
function nomCanon(n){ const k=normNom(n); if(!k) return ''; return (S.nomsAbs||{})[k] || n.trim().replace(/\s+/g,' '); }
async function chargerNomsAbsents(){
  if(S.nomsAbs) return; S.nomsAbs = {};
  try{
    const r = await db.get('fiches_vacation','select=absents&absents=not.is.null&order=updated_at.desc&limit=500');
    r.forEach(x=>(x.absents||[]).forEach(a=>{ if(a&&a.nom&&a.nom.trim()){ const k=normNom(a.nom); if(!S.nomsAbs[k]) S.nomsAbs[k]=a.nom.trim().replace(/\s+/g,' '); } }));
  }catch(e){ console.warn('noms absents', e); }
}
function htmlAbsents(f){
  const inp = 'padding:8px 6px;border:1.5px solid var(--gris-bord);border-radius:8px;font-size:13px;background:white;box-sizing:border-box;width:100%';
  const lst = Object.values(S.nomsAbs||{}).sort().map(n=>`<option value="${escHtml(n)}">`).join('');
  const ab = f.absents||[];
  return `<div style="margin-top:10px;border-top:1px dashed #cbd5e1;padding-top:8px">
    <div style="font-weight:700;font-size:13px">🔒 Absents <span style="font-weight:400;font-size:11px;color:var(--texte-doux)">— interne, n'apparaît dans aucun rapport</span></div>
    <datalist id="liste-noms-abs">${lst}</datalist>
    ${ab.map((a,i)=>`<div style="display:grid;grid-template-columns:1.4fr 1fr auto;gap:6px;margin-top:6px">
      <input type="text" list="liste-noms-abs" style="${inp}" placeholder="Nom Prénom" value="${escHtml(a.nom||'')}" oninput="fSet('absents.${i}.nom',this.value)" onchange="fNomAbs(${i},this.value)" />
      <select style="${inp}" onchange="fSet('absents.${i}.motif',this.value)">${MOTIFS_ABS.map(m=>`<option ${a.motif===m?'selected':''}>${m}</option>`).join('')}</select>
      <button onclick="fDelAbsent(${i})" style="padding:6px 10px;background:#fee2e2;color:#dc2626;border:1.5px solid #dc2626;border-radius:8px;font-weight:700">🗑</button></div>`).join('')}
    <button onclick="fAddAbsent()" style="margin-top:8px;padding:8px 12px;background:#e8f0fb;color:var(--bleu);border:1.5px solid var(--bleu);border-radius:8px;font-weight:700;font-size:12px">+ Ajouter un absent</button>
  </div>`;
}
function fAddAbsent(){ fStruct(f=>{ f.absents=f.absents||[]; f.absents.push({nom:'',motif:MOTIFS_ABS[0]}); }); }
function fDelAbsent(i){ fStruct(f=>f.absents.splice(i,1)); }
function fNomAbs(i,v){ const c=nomCanon(v); if(S.fiche.absents[i]){ S.fiche.absents[i].nom=c; const k=normNom(c); if(k){ S.nomsAbs=S.nomsAbs||{}; if(!S.nomsAbs[k]) S.nomsAbs[k]=c; } } render(); planifierSaveFiche(); }
function fAddLigne(){ fStruct(f=>f.volumes.push({nom:'Ligne '+(f.volumes.length+1), debut:'', fin:'', total:'', disp:''})); }
function fDelLigne(i){ if(!confirm('Supprimer cette ligne ?')) return; fStruct(f=>f.volumes.splice(i,1)); }
function fAddLiaison(){ fStruct(f=>{ if(f.conc.liaisons.length<4) f.conc.liaisons.push({camions:[{debut:'',fin:'',colis:''}]}); }); }

// ── Synthèse automatique d'une vacation ────────────────────────
function syntheseVac(d){
  const colis = (d.colis||[]).filter(c=>c.quantite_colis);
  const moy = colis.length ? calcMoyenneColisArchive(d.colis) : null;
  const sess = {}; (d.colis||[]).forEach(c=>{ const s=c.session_numero||1; sess[s]=Math.max(sess[s]||0, c.arret_machine_cumul||0); });
  const arret = Object.values(sess).reduce((a,b)=>a+b,0);
  const nok = colis.filter(c=>c.cadence_ok===false);
  const raisons = {}; nok.forEach(c=>{ const r=(c.raison_non_atteinte||'').trim(); if(r) raisons[r]=(raisons[r]||0)+1; });
  const trn = (d.tournees||[]).filter(t=>t.resultat);
  const trnNok = trn.filter(t=>t.resultat!=='OK');
  const epiM = (d.epi||[]).filter(e=>e.nom_prenom&&e.nom_prenom!=='RAS');
  const parType = TYPES_ANOMALIE.map(t=>({t,n:(d.anomalies||[]).filter(a=>a.type_anomalie===t.code).length})).filter(x=>x.n);
  return {moy, nbReleves:colis.length, nok:nok.length, raisons, arret, trnTot:trn.length, trnNok:trnNok.length, epiM, parType, nbAno:(d.anomalies||[]).length, nbCtrl:(d.controles||[]).length};
}
function faitsMarquants(s, fiche, eq){
  const L = [];
  if(s.moy!=null) L.push(`Cadence moyenne de <b>${fmtN(s.moy)} colis/h</b> pour un objectif de ${fmtN(OBJECTIF_COLIS)} : ${s.moy>=OBJECTIF_COLIS?'objectif atteint ✅':'objectif non atteint ('+fmtN(s.moy-OBJECTIF_COLIS)+' colis/h) ❌'}.`);
  else L.push('Aucun relevé de cadence exploitable sur cette vacation.');
  if(s.nok){ const r = Object.entries(s.raisons).sort((a,b)=>b[1]-a[1]).map(([k,n])=>escHtml(k)+(n>1?' ('+n+')':'')).join(', ');
    L.push(`<b>${s.nok}</b> relevé(s) sous objectif sur ${s.nbReleves}${r?' — causes citées : '+r:' — aucune cause renseignée'}.`); }
  if(s.arret) L.push(`Arrêts machine cumulés : <b>${s.arret} min</b> (déduits du calcul de cadence).`);
  if(s.nbAno) L.push(`<b>${s.nbAno}</b> anomalie(s) signalée(s) : ${s.parType.map(x=>x.t.code+' '+x.n).join(', ')}.`); else L.push('Aucune anomalie signalée.');
  if(s.trnTot) L.push(`Contrôles chantiers : ${s.trnTot-s.trnNok}/${s.trnTot} tournées conformes${s.trnNok?' — <b>'+s.trnNok+' non conforme(s)</b>':''}.`);
  if(s.epiM.length) L.push(`EPI : <b>${s.epiM.length}</b> manquement(s) — ${s.epiM.map(e=>escHtml(e.nom_prenom)+' ('+escHtml(e.epi_manquant||'?')+')').join(', ')}.`); else L.push('Aucun manquement EPI.');
  if(fiche){
    if(aVal(fiche.presents)) L.push(`Effectif présent : <b>${nI(fiche.presents)}</b> personne(s).`);
    if(fiche.fin_tri || fiche.cible_tri) L.push(txtTri(fiche)+'.');
  }
  if(fiche && fiche.commentaire) L.push(`Événements : ${escHtml(fiche.commentaire)}`);
  return L;
}

    ${[['🌆 Aprem',fa,false],['☀️ Matin',fm,false],['🚚 Concentration',fa,true]].map(([n,f,conc])=>{
      const pr = f?(conc?f.conc.presents:f.presents):'';
      const tri = (!conc&&f&&f.fin_tri)?(f.fin_tri+' / '+(f.cible_tri||'—')+(ecartTri(f.fin_tri,f.cible_tri)!=null?' ('+(ecartTri(f.fin_tri,f.cible_tri)<=0?'✅':'⏱ +'+ecartTri(f.fin_tri,f.cible_tri)+' min')+')':'')):'—';
      return `<tr style="border-bottom:1px solid #eee"><td style="padding:6px">${n}</td><td style="${t0}">${aVal(pr)?nI(pr):'—'}</td><td style="${t0}">${tri}</td></tr>`; }).join('')}
  </table>`;
}

// EXPORT KPI (fichier Excel avec feuilles de données + feuilles d'analyse)
// ══════════════════════════════════════════════════════════════
function serialDate(iso){ const p=iso.split('-').map(Number); return Math.round((Date.UTC(p[0],p[1]-1,p[2])-Date.UTC(1899,11,30))/86400000); }
function lundiIso(iso){ return isoLocal(lundiDe(new Date(iso+'T12:00:00'))); }
function equipeKpi(eq){ const t=typeEquipe(eq); return t==='aprem'?'Aprem':(t==='matin'?'Matin':(eq||'Autre')); }

function preparerKPI(raw){
  const P = {vac:[], vol:[], conc:[], rel:[], ano:[], epi:[], kpi:[]};
  const pour = id => x => String(x.vacation_id)===String(id);
  const infos = raw.vacs.map(v=>{
    const colis = raw.colis.filter(pour(v.id)), anos = raw.anos.filter(pour(v.id)), epis = raw.epis.filter(pour(v.id));
    const ctrls = raw.ctrls.filter(pour(v.id)), fr = raw.fiches.find(pour(v.id)), f = fr?normFiche(fr):null;
    const tourn = raw.tourn.filter(t=>ctrls.some(c=>c.id===t.controle_id));
    const score = colis.filter(c=>c.quantite_colis).length + anos.length + epis.filter(e=>e.nom_prenom&&e.nom_prenom!=='RAS').length + ctrls.length
      + (f ? f.volumes.length + (aVal(f.presents)?1:0) + f.conc.liaisons.length + (f.fin_tri?1:0) : 0);
    return {v, colis, anos, epis, ctrls, tourn, f, score};
  }).filter(x=>x.score>0);
  const best = {};
  infos.forEach(x=>{ const k=x.v.date+'|'+equipeKpi(x.v.equipe); if(!best[k] || x.score>best[k].score) best[k]=x; });
  Object.values(best).sort((a,b)=> a.v.date<b.v.date?-1:(a.v.date>b.v.date?1:0)).forEach(x=>{
    const v = x.v, eq = equipeKpi(v.equipe), lun = lundiMetier(v.date, v.equipe), f = x.f, c = calcFiche(f);
    const ag = raw.agents.find(a=>String(a.id)===String(v.agent_id)); const chef = ag?(ag.prenom+' '+ag.nom):'';
    const prev = f ? prevusEff(f, v.equipe, false) : prevusEff(null, v.equipe, false);
    const ecart = f ? ecartTri(f.fin_tri, f.cible_tri) : null;
    const rel = x.colis.filter(c2=>c2.quantite_colis);
    const sess = {}; x.colis.forEach(c2=>{ const s=c2.session_numero||1; sess[s]=Math.max(sess[s]||0, c2.arret_machine_cumul||0); });
    const trnRes = x.tourn.filter(t=>t.resultat);
    P.vac.push([{d:v.date},{d:lun},eq,chef, (prev==null||!(f&&aVal(f.presents)))?'':prev, f&&aVal(f.presents)?nI(f.presents):'', f&&aVal(f.interim)?nI(f.interim):'',
      f?f.cible_tri:'', f?f.fin_tri:'', ecart==null?'':ecart, f&&c.lignes.length?c.sumDisp:'', f&&c.lignes.length?c.sumDist:'', f&&aVal(f.hn)?c.hn:'', f&&(c.lignes.length||aVal(f.hn))?c.totalHN:'', '',
      rel.length?(calcMoyenneColisArchive(x.colis)||''):'', rel.length, rel.filter(c2=>c2.cadence_ok===false).length, Object.values(sess).reduce((a,b)=>a+b,0),
      x.anos.length, x.epis.filter(e=>e.nom_prenom&&e.nom_prenom!=='RAS').length, trnRes.length, trnRes.filter(t=>t.resultat!=='OK').length]);
    const hasPres = f && aVal(f.presents);
    const anoN = code => x.anos.filter(a=>(a.type_anomalie||'AUTRE')===code).length;
    const tNom = x.anos.filter(a=>!['ERA','PU','SP','MEP','FACTEO'].includes(a.type_anomalie||'AUTRE')).length;
    const ea = hasPres&&prev!=null?effAbs(f, prev, f.presents):null;
    P.kpi.push({cle:v.date+'|'+eq, date:v.date, lundi:lun, equipe:eq,
      absents: ea?ea.absN:null, base_eff: ea?ea.base:null,
      prevus: hasPres&&prev!=null?prev:null, presents: hasPres?nI(f.presents):null, interimaires: f&&aVal(f.interim)?nI(f.interim):null,
      cible_tri: f&&f.cible_tri?f.cible_tri:null, fin_tri: f&&f.fin_tri?f.fin_tri:null, ecart_fin: ecart==null?null:ecart,
      dispersion: f&&c.lignes.length?c.sumDisp:null, distribution: f&&c.lignes.length?c.sumDist:null, hn: f&&aVal(f.hn)?c.hn:null,
      total_colis: f&&(c.lignes.length||aVal(f.hn))?c.totalHN:null, colis_charges:null,
      cadence: rel.length?(calcMoyenneColisArchive(x.colis)||null):null, releves: rel.length, sous_objectif: rel.filter(c2=>c2.cadence_ok===false).length,
      arret_min: Object.values(sess).reduce((a,b)=>a+b,0), anomalies:x.anos.length, ano_era:anoN('ERA'), ano_pu:anoN('PU'), ano_sp:anoN('SP'), ano_mep:anoN('MEP'), ano_facteo:anoN('FACTEO'), ano_autre:tNom,
      epi: x.epis.filter(e=>e.nom_prenom&&e.nom_prenom!=='RAS').length, tournees:trnRes.length, tournees_nok:trnRes.filter(t=>t.resultat!=='OK').length});
    if(f && /^aprem$/i.test(eq) && (aVal(f.conc.presents) || c.liaisons.length)){
      P.kpi.push({cle:v.date+'|Concentration', date:v.date, lundi:lun, equipe:'Concentration',
        prevus: aVal(f.conc.presents)?(aVal(f.conc.prevus)?nI(f.conc.prevus):PREVUS_DEFAUT.conc):null, presents: aVal(f.conc.presents)?nI(f.conc.presents):null, interimaires: aVal(f.conc.interim)?nI(f.conc.interim):null,
        cible_tri:null, fin_tri:null, ecart_fin:null, dispersion:null, distribution:null, hn:null, total_colis:null, colis_charges:c.totConc, cadence:null, releves:0, sous_objectif:0, arret_min:0,
        anomalies:0, ano_era:0, ano_pu:0, ano_sp:0, ano_mep:0, ano_facteo:0, ano_autre:0, epi:0, tournees:0, tournees_nok:0,
        absents: aVal(f.conc.presents)?Math.max(0,(aVal(f.conc.prevus)?nI(f.conc.prevus):PREVUS_DEFAUT.conc)-nI(f.conc.presents)):null, base_eff: aVal(f.conc.presents)?(aVal(f.conc.prevus)?nI(f.conc.prevus):PREVUS_DEFAUT.conc):null});
      P.vac.push([{d:v.date},{d:lun},'Concentration',chef, !aVal(f.conc.presents)?'':(aVal(f.conc.prevus)?nI(f.conc.prevus):PREVUS_DEFAUT.conc), aVal(f.conc.presents)?nI(f.conc.presents):'', aVal(f.conc.interim)?nI(f.conc.interim):'',
        '','','','','','','', c.totConc, '','','','','','','','']);
    }
    c.lignes.forEach(l=>P.vol.push([{d:v.date},{d:lun},eq,l.nom||'',l.debut||'',l.fin||'', aVal(l.total)?nI(l.total):'', aVal(l.total)?nI(l.disp):'', l.distrib==null?'':l.distrib]));
    if(f && /^aprem$/i.test(eq)) c.liaisons.forEach((li,i)=>(li.camions||[]).forEach((cm,k)=>P.conc.push([{d:v.date},{d:lun},i+1,k+1,cm.debut||'',cm.fin||'', aVal(cm.colis)?nI(cm.colis):''])));
    rel.forEach(c2=>P.rel.push([{d:v.date},{d:lun},eq,c2.session_numero||1,c2.ligne_numero||1,c2.heure_controle||'',c2.quantite_colis,c2.cadence_ok===false?'NON':'OUI',c2.cadence_ok===false?(c2.raison_non_atteinte||''):'',c2.arret_machine_cumul||0]));
    x.anos.forEach(a=>P.ano.push([{d:v.date},{d:lun},eq,a.type_anomalie||'AUTRE',a.brin_mep||'',a.description||'']));
    x.epis.filter(e=>e.nom_prenom&&e.nom_prenom!=='RAS').forEach(e=>P.epi.push([{d:v.date},{d:lun},eq,e.nom_prenom,e.epi_manquant||'',e.solution||'']));
  });
  return P;
}

function construireClasseurKPI(P, from, to){
  const wb = XLSX.utils.book_new();
  const FD = 'dd/mm/yyyy';
  function feuille(entetes, lignes, largeurs){
    const ws = {};
    entetes.forEach((h,c)=>{ ws[XLSX.utils.encode_cell({r:0,c})] = {t:'s', v:h}; });
    lignes.forEach((row,r)=>row.forEach((val,c)=>{
      if(val===''||val==null) return;
      const a = XLSX.utils.encode_cell({r:r+1,c});
      if(typeof val==='object' && val.d) ws[a] = {t:'n', v:serialDate(val.d), z:FD};
      else if(typeof val==='object' && val.f){ ws[a] = {t:'n', f:val.f}; if(val.z) ws[a].z = val.z; }
      else if(typeof val==='number') ws[a] = {t:'n', v:val};
      else ws[a] = {t:'s', v:String(val)};
    }));
    ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:Math.max(lignes.length,1), c:entetes.length-1}});
    ws['!cols'] = entetes.map((h,i)=>({wch: (largeurs&&largeurs[i]) || Math.max(11, Math.min(34, h.length+3))}));
    return ws;
  }
  // 1) Lisez-moi
  const lm = [
    'KPI Cahier de vacation — La Poste Mulhouse',
    'Période exportée : du '+from+' au '+to+' (généré le '+new Date().toLocaleDateString('fr-FR')+')',
    '',
    'FEUILLES D\'ANALYSE (calculées automatiquement, une ligne par semaine) :',
    '  KPI_Effectifs : prévus, présents, intérimaires et absentéisme par équipe',
    '  KPI_FinTri : heure de fin de tri vs heure cible, ponctualité',
    '  KPI_Volumes : dispersion, distribution, HN, totaux avec et sans Concentration',
    '  KPI_Cadence : colis/h moyen, relevés sous objectif, arrêts machine',
    '  KPI_Anomalies : anomalies par type et manquements EPI',
    '',
    'FEUILLES DE DONNÉES (brutes, une ligne par vacation / ligne / camion / anomalie) :',
    '  Vacations, Volumes, Concentration, Releves, Anomalies, EPI',
    '',
    'Les feuilles d\'analyse lisent les feuilles de données : ne supprimez pas leurs colonnes.',
    'Pour mettre à jour : refaites l\'export dans l\'application (Admin > Export KPI).',
    'Objectif de cadence : '+OBJECTIF_COLIS+' colis/h. Effectifs prévus : Aprem '+PREVUS_DEFAUT.aprem+', Matin '+PREVUS_DEFAUT.matin+', Concentration '+PREVUS_DEFAUT.conc+'.'
  ];
  const wsLm = {}; lm.forEach((t,r)=>{ if(t) wsLm[XLSX.utils.encode_cell({r,c:0})] = {t:'s', v:t}; });
  wsLm['!ref'] = 'A1:A'+lm.length; wsLm['!cols'] = [{wch:110}];
  XLSX.utils.book_append_sheet(wb, wsLm, 'Lisez-moi');

  // 2) Feuilles d'analyse
  const lundis = []; { let d = new Date(lundiIso(from)+'T12:00:00'); const fin = new Date(to+'T12:00:00'); while(d<=fin){ lundis.push(isoLocal(d)); d.setDate(d.getDate()+7); } }
  const V = 'Vacations!';
  const col = i => XLSX.utils.encode_col(i);
  const sumifs = (c,r,team)=>`SUMIFS(${V}$${c}:$${c},${V}$B:$B,$A${r},${V}$C:$C,"${team}")`;

  // Effectifs
  { const teams=['Aprem','Matin','Concentration']; const H=['Semaine (lundi)']; teams.forEach(t=>H.push(t+' — prévus',t+' — présents',t+' — intérimaires',t+' — absentéisme'));
    const rows = lundis.map((l,i)=>{ const r=i+2; const row=[{d:l}];
      teams.forEach((t,k)=>{ const b=1+k*4; row.push({f:sumifs('E',r,t)},{f:sumifs('F',r,t)},{f:sumifs('G',r,t)},{f:`IF(${col(b)}${r}=0,"",(${col(b)}${r}-${col(b+1)}${r})/${col(b)}${r})`, z:'0.0%'}); });
      return row; });
    XLSX.utils.book_append_sheet(wb, feuille(H, rows), 'KPI_Effectifs'); }
  // Fin de tri
  { const teams=['Aprem','Matin']; const H=['Semaine (lundi)']; teams.forEach(t=>H.push(t+' — fins de tri saisies',t+' — dans les temps',t+' — ponctualité',t+' — écart moyen (min)',t+' — retard moyen si en retard (min)'));
    const rows = lundis.map((l,i)=>{ const r=i+2; const row=[{d:l}];
      teams.forEach((t,k)=>{ const b=1+k*5; const base=`${V}$B:$B,$A${r},${V}$C:$C,"${t}"`;
        row.push({f:`COUNTIFS(${base},${V}$J:$J,">-100000")`},{f:`COUNTIFS(${base},${V}$J:$J,"<=0")`},{f:`IF(${col(b)}${r}=0,"",${col(b+1)}${r}/${col(b)}${r})`, z:'0%'},
          {f:`IFERROR(AVERAGEIFS(${V}$J:$J,${base}),"")`, z:'0.0'},{f:`IFERROR(AVERAGEIFS(${V}$J:$J,${base},${V}$J:$J,">0"),"")`, z:'0.0'}); });
      return row; });
    XLSX.utils.book_append_sheet(wb, feuille(H, rows), 'KPI_FinTri'); }
  // Volumes
  { const H=['Semaine (lundi)','Dispersion','Distribution','HN','Total sans Concentration','Colis chargés Concentration','Total avec Concentration','Total Aprem','Total Matin'];
    const rows = lundis.map((l,i)=>{ const r=i+2; const two=c=>`${sumifs(c,r,'Aprem')}+${sumifs(c,r,'Matin')}`;
      return [{d:l},{f:two('K')},{f:two('L')},{f:two('M')},{f:two('N')},{f:sumifs('O',r,'Concentration')},{f:`E${r}+F${r}`},{f:sumifs('N',r,'Aprem')},{f:sumifs('N',r,'Matin')}]; });
    const n = lundis.length+1; rows.push(['TOTAL',...[1,2,3,4,5,6,7,8].map(c=>({f:`SUM(${col(c)}2:${col(c)}${n})`}))]);
    XLSX.utils.book_append_sheet(wb, feuille(H, rows), 'KPI_Volumes'); }
  // Cadence
  { const teams=['Aprem','Matin']; const H=['Semaine (lundi)']; teams.forEach(t=>H.push(t+' — colis/h moyen',t+' — relevés',t+' — % sous objectif',t+' — arrêts machine (min)'));
    const rows = lundis.map((l,i)=>{ const r=i+2; const row=[{d:l}];
      teams.forEach((t,k)=>{ const b=1+k*4; row.push({f:`IFERROR(AVERAGEIFS(${V}$P:$P,${V}$B:$B,$A${r},${V}$C:$C,"${t}"),"")`, z:'0'},{f:sumifs('Q',r,t)},
        {f:`IF(${col(b+1)}${r}=0,"",${sumifs('R',r,t)}/${col(b+1)}${r})`, z:'0%'},{f:sumifs('S',r,t)}); });
      return row; });
    XLSX.utils.book_append_sheet(wb, feuille(H, rows), 'KPI_Cadence'); }
  // Anomalies
  { const types=TYPES_ANOMALIE.map(t=>t.code); const H=['Semaine (lundi)',...types,'Total anomalies','Manquements EPI'];
    const rows = lundis.map((l,i)=>{ const r=i+2; return [{d:l}, ...types.map(t=>({f:`COUNTIFS(Anomalies!$B:$B,$A${r},Anomalies!$D:$D,"${t}")`})), {f:`COUNTIFS(Anomalies!$B:$B,$A${r})`}, {f:`COUNTIFS(EPI!$B:$B,$A${r})`}]; });
    const n = lundis.length+1; rows.push(['TOTAL',...Array.from({length:types.length+2},(_,c)=>({f:`SUM(${col(c+1)}2:${col(c+1)}${n})`}))]);
    XLSX.utils.book_append_sheet(wb, feuille(H, rows), 'KPI_Anomalies'); }

  // 3) Données
  XLSX.utils.book_append_sheet(wb, feuille(['Date','Semaine (lundi)','Équipe','Chef d\'équipe','Prévus','Présents','Intérimaires','Cible fin de tri','Fin de tri','Écart fin de tri (min)','Dispersion','Distribution','HN','Total colis (HN inclus)','Colis chargés (Concentration)','Colis/h moyen','Relevés','Relevés sous objectif','Arrêts machine (min)','Anomalies','Manquements EPI','Tournées contrôlées','Tournées non conformes'], P.vac), 'Vacations');
  XLSX.utils.book_append_sheet(wb, feuille(['Date','Semaine (lundi)','Équipe','Ligne','Début','Fin','Total colis','Dispersion','Distribution'], P.vol), 'Volumes');
  XLSX.utils.book_append_sheet(wb, feuille(['Date','Semaine (lundi)','Liaison','Camion','Début','Fin','Colis chargés'], P.conc), 'Concentration');
  XLSX.utils.book_append_sheet(wb, feuille(['Date','Semaine (lundi)','Équipe','Session','Ligne','Heure relevé','Quantité','Cadence OK','Raison si NOK','Arrêt machine cumulé (min)'], P.rel), 'Releves');
  XLSX.utils.book_append_sheet(wb, feuille(['Date','Semaine (lundi)','Équipe','Type','Précision','Description'], P.ano, [12,14,12,10,22,60]), 'Anomalies');
  XLSX.utils.book_append_sheet(wb, feuille(['Date','Semaine (lundi)','Équipe','Nom','EPI manquant','Solution'], P.epi, [12,14,12,26,24,40]), 'EPI');
  wb.Workbook = {CalcPr:{fullCalcOnLoad:true}};
  return wb;
}

async function getParLots(table, col, ids, extra){
  const out = []; for(let i=0;i<ids.length;i+=40){ const lot = ids.slice(i,i+40); out.push(...await db.get(table, `${col}=in.(${lot.join(',')})${extra||''}`)); } return out;
}
async function exporterKPI(){
  const from = document.getElementById('kpi-from').value, to = document.getElementById('kpi-to').value;
  if(!from||!to||from>to) return toast('Choisissez une période valide','err');
  if(typeof XLSX==='undefined') return toast('Bibliothèque Excel non chargée (connexion ?)','err');
  const btn = document.getElementById('kpi-btn'); if(btn){ btn.disabled=true; btn.textContent='⏳ Préparation…'; }
  try{
    const vacs = await db.get('vacations_suivi',`date=gte.${from}&date=lte.${to}&select=*&order=date.asc`);
    const ids = vacs.map(v=>v.id);
    const raw = {vacs, colis:[], anos:[], epis:[], ctrls:[], tourn:[], fiches:[], agents:[]};
    if(ids.length){
      raw.colis = await getParLots('controles_colis','vacation_id',ids,'&select=vacation_id,session_numero,ligne_numero,heure_controle,quantite_colis,cadence_ok,raison_non_atteinte,arret_machine_cumul');
      raw.anos = await getParLots('anomalies','vacation_id',ids,'&select=vacation_id,type_anomalie,brin_mep,description');
      raw.epis = await getParLots('epi','vacation_id',ids,'&select=vacation_id,nom_prenom,epi_manquant,solution');
      raw.ctrls = await getParLots('controles_chantiers','vacation_id',ids,'&select=id,vacation_id');
      if(raw.ctrls.length) raw.tourn = await getParLots('tournees','controle_id',raw.ctrls.map(c=>c.id),'&select=controle_id,resultat');
      try{ raw.fiches = await getParLots('fiches_vacation','vacation_id',ids,''); }catch(e){ raw.fiches = []; }
      raw.agents = await db.get('agents','select=id,prenom,nom');
    }
    const P = preparerKPI(raw);
    if(!P.vac.length){ toast('Aucune donnée sur cette période','err'); return; }
    const wb = construireClasseurKPI(P, from, to);
    XLSX.writeFile(wb, `KPI_Cahier_MLH_${from}_${to}.xlsx`);
    toast(`✅ Fichier généré (${P.vac.length} lignes de vacation)`,'ok');
  }catch(e){ console.error(e); toast('Erreur export : '+(e.message||e),'err'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='📥 Télécharger le fichier Excel KPI'; } }
}
function renderExportKPI(){
  const d = new Date(); d.setDate(d.getDate()-60);
  return `<div class="card">
    <div class="card-title">📈 Export KPI (Excel)</div>
    <div class="info-banner">Génère un fichier Excel avec les feuilles d'analyse (effectifs, fin de tri, volumes, cadence, anomalies) et les données brutes.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
      <div><label class="form-label">Du</label><input class="form-input" type="date" id="kpi-from" value="${isoLocal(d)}" /></div>
      <div><label class="form-label">Au</label><input class="form-input" type="date" id="kpi-to" value="${getToday()}" /></div>
    </div>
    <button class="btn-primary" id="kpi-btn" onclick="exporterKPI()">📥 Télécharger le fichier Excel KPI</button>
  </div>`;
}

function planifierSyncKPI(){ clearTimeout(_kpiTimer); _kpiTimer = setTimeout(syncKPIVacationCourante, 4000); }
async function syncKPIVacationCourante(){

async function majKPIPeriode(from, to){
  const vacs = await db.get('vacations_suivi',`date=gte.${from}&date=lte.${to}&select=*&order=date.asc`);
  const ids = vacs.map(v=>v.id); if(!ids.length) return 0;
  const raw = {vacs, colis:[], anos:[], epis:[], ctrls:[], tourn:[], fiches:[], agents:[]};
  raw.colis = await getParLots('controles_colis','vacation_id',ids,'&select=vacation_id,session_numero,ligne_numero,heure_controle,quantite_colis,cadence_ok,raison_non_atteinte,arret_machine_cumul');
  raw.anos = await getParLots('anomalies','vacation_id',ids,'&select=vacation_id,type_anomalie');
  raw.epis = await getParLots('epi','vacation_id',ids,'&select=vacation_id,nom_prenom,epi_manquant,solution');
  raw.ctrls = await getParLots('controles_chantiers','vacation_id',ids,'&select=id,vacation_id');
  if(raw.ctrls.length) raw.tourn = await getParLots('tournees','controle_id',raw.ctrls.map(c=>c.id),'&select=controle_id,resultat');
  try{ raw.fiches = await getParLots('fiches_vacation','vacation_id',ids,''); }catch(e){ raw.fiches = []; }
  const P = preparerKPI(raw);
  if(P.kpi.length) await posterKPI(P.kpi);
  return P.kpi.length;
}

const _sum=(r,k)=>r.reduce((a,x)=>a+(x[k]||0),0);
const _eq=(r,e)=>r.filter(x=>x.equipe===e);
const _avg=a=>a.length?a.reduce((s,b)=>s+b,0)/a.length:null;
const _abs=(r,e)=>{ const q=_eq(r,e).filter(x=>x.presents!=null&&x.prevus); const nn=x=>x.base_eff!=null?x.base_eff:x.prevus; const aa=x=>x.absents!=null?x.absents:Math.max(0,x.prevus-x.presents); const p=q.reduce((a,x)=>a+nn(x),0); return p?q.reduce((a,x)=>a+aa(x),0)/p*100:null; };
const _pres=(r,e)=>_avg(_eq(r,e).filter(x=>x.presents!=null).map(x=>x.presents));
const _ponct=(r,e)=>{ const q=_eq(r,e).filter(x=>x.ecart_fin!=null); return q.length?q.filter(x=>x.ecart_fin<=0).length/q.length*100:null; };
const _ecart=(r,e)=>_avg(_eq(r,e).filter(x=>x.ecart_fin!=null).map(x=>x.ecart_fin));
const _cad=(r,e)=>_avg(_eq(r,e).filter(x=>x.cadence!=null).map(x=>x.cadence));
const _sans=r=>_sum(_eq(r,'Aprem'),'total_colis')+_sum(_eq(r,'Matin'),'total_colis');

function addJours(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoLocal(d); }
function agregHebdo(rows){
  const m = {}; (rows||[]).forEach(r=>{ (m[r.lundi]=m[r.lundi]||[]).push(r); });
  const out = {}; Object.keys(m).forEach(w=>{ out[w]={}; INDIC.forEach(i=>{ out[w][i.id]=i.f(m[w]); }); });
  return out;
}
function fmtKPI(v,u){
  if(v==null||isNaN(v)) return '—';
  if(u==='%') return v.toFixed(1).replace('.',',')+' %';
  if(u==='min') return (Math.round(v*10)/10).toString().replace('.',',')+' min';
  return Number.isInteger(v)||Math.abs(v)>=100 ? fmtN(Math.round(v)) : v.toFixed(1).replace('.',',');
}
function sparkline(vals, couleur){
  const v = vals.filter(x=>x!=null); if(v.length<2) return '';
  const mn=Math.min(...v), mx=Math.max(...v), W=64, H=18; const rg=(mx-mn)||1;
  const pts = vals.map((x,i)=> x==null?null:[ (i/(vals.length-1))*W, H-2-((x-mn)/rg)*(H-4) ]).filter(Boolean);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="${couleur}" stroke-width="1.6" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/></svg>`;
}

async function chargerAbsencesPersonnes(){
  if(S.absPers) return;
  S.absPers = {lignes:[]};
  try{
    const fs = await db.get('fiches_vacation','select=vacation_id,absents&absents=not.is.null&order=updated_at.desc&limit=1000');
    const avec = fs.filter(x=>Array.isArray(x.absents)&&x.absents.some(a=>a&&a.nom&&a.nom.trim()));
    if(!avec.length){ render(); return; }
    const vs = await getParLots('vacations_suivi','id',avec.map(x=>x.vacation_id),'&select=id,date,equipe');
    const seen = {}, per = {};
    avec.forEach(x=>{ const v=vs.find(z=>String(z.id)===String(x.vacation_id)); if(!v) return;
      x.absents.forEach(a=>{ if(!a||!a.nom||!a.nom.trim()) return; const k=normNom(a.nom); const dk=v.date+'|'+equipeKpi(v.equipe)+'|'+k; if(seen[dk]) return; seen[dk]=1;
        const o=per[k]=per[k]||{nom:a.nom.trim(),n:0,motifs:{},der:'',dates:[]}; o.n++; o.motifs[a.motif||'Autre']=(o.motifs[a.motif||'Autre']||0)+1; if(v.date>o.der) o.der=v.date; }); });
    S.absPers = {lignes:Object.values(per).sort((a,b)=>b.n-a.n||a.nom.localeCompare(b.nom))};
  }catch(e){ console.warn('absences', e); }
  render();
}
